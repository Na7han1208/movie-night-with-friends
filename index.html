<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Movie Night</title>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=DM+Sans:wght@300;400;500;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --ink:#0e0e12;
  --paper:#f5f2eb;
  --paper2:#ede9e0;
  --paper3:#e0dbd0;
  --line:#c8c2b4;
  --mute:#9a9488;
  --ghost:#b8b2a6;
  --red:#d63e2a;
  --blue:#2a6dd6;
  --grn:#2ab85a;
  --ylw:#d6a42a;
  --r:3px;
}
html,body{height:100%;width:100%;background:var(--paper);color:var(--ink);font-family:'DM Sans',system-ui,sans-serif;overflow:hidden;}

.scr{
  position:fixed;inset:0;display:flex;flex-direction:column;
  opacity:0;pointer-events:none;
  transition:opacity .5s ease, transform .5s ease;
  transform:scale(1.015);
  background:var(--paper);
}
.scr.on{opacity:1;pointer-events:all;transform:scale(1);}
.scr.out{opacity:0;transform:scale(.985);}

.mono{font-family:'DM Mono',monospace;}
.label{font-family:'DM Mono',monospace;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);}

.btn{display:inline-flex;align-items:center;justify-content:center;background:var(--ink);color:var(--paper);border:none;border-radius:var(--r);padding:18px 36px;font-family:'DM Sans',sans-serif;font-size:18px;font-weight:500;letter-spacing:.04em;cursor:pointer;transition:opacity .15s,transform .1s;}
.btn:hover{opacity:.82;}
.btn:active{transform:scale(.97);}
.btn-ghost{display:inline-flex;align-items:center;justify-content:center;background:transparent;color:var(--mute);border:2px solid var(--line);border-radius:var(--r);padding:18px 36px;font-family:'DM Sans',sans-serif;font-size:18px;cursor:pointer;transition:all .15s;}
.btn-ghost:hover{border-color:var(--ink);color:var(--ink);}

.metro-bar{height:4px;background:var(--ink);}
.metro-bar.red{background:var(--red);}
.metro-bar.blue{background:var(--blue);}

/* ── LOBBY ── */
#sLobby{flex-direction:row;}
.lobby-qr-side{
  flex:0 0 55%;display:flex;flex-direction:column;align-items:center;justify-content:center;
  border-right:3px solid var(--ink);padding:4rem;gap:2rem;
}
.lobby-players-side{
  flex:1;display:flex;flex-direction:column;padding:4rem 3rem;gap:2rem;overflow:hidden;
}
.qr-frame-big{
  background:#fff;padding:16px;border:3px solid var(--ink);border-radius:var(--r);
  width:min(42vw,460px);height:min(42vw,460px);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.lobby-title{font-family:'DM Mono',monospace;font-size:2.4rem;font-weight:300;letter-spacing:-.02em;}
.lobby-hint{font-size:1.1rem;color:var(--mute);line-height:1.6;}
.player-grid{display:flex;flex-wrap:wrap;gap:12px;align-content:flex-start;flex:1;overflow:hidden;}
.player-chip{
  font-family:'DM Mono',monospace;font-size:1.1rem;
  border:2px solid var(--ink);border-radius:var(--r);
  padding:10px 18px;background:var(--paper);
  animation:chipIn .3s cubic-bezier(.34,1.56,.64,1);
}
@keyframes chipIn{from{opacity:0;transform:scale(.8);}to{opacity:1;transform:scale(1);}}
.lobby-action{display:flex;gap:1rem;margin-top:auto;}
.player-count-big{font-family:'DM Mono',monospace;font-size:5rem;font-weight:300;line-height:1;letter-spacing:-.04em;}

/* ── FISHBOWL SUBMISSION ── */
#sSubmit{align-items:stretch;}
.submit-top{
  display:flex;align-items:center;justify-content:space-between;
  padding:2.5rem 4rem;border-bottom:3px solid var(--ink);flex-shrink:0;
}
.submit-title{font-family:'DM Mono',monospace;font-size:2rem;font-weight:300;}
.timer-ring-wrap{position:relative;width:90px;height:90px;flex-shrink:0;}
.timer-ring-wrap svg{transform:rotate(-90deg);}
.timer-ring-num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'DM Mono',monospace;font-size:1.2rem;font-weight:400;}
.fishbowl-area{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:2rem;}
#fishCanvas{display:block;}

/* ── HOST VOTE ── */
#sHostVote{padding:0;}
.vote-top{
  display:flex;align-items:center;gap:2rem;
  padding:3rem 5rem;border-bottom:3px solid var(--ink);flex-shrink:0;
}
.vote-title{font-family:'DM Mono',monospace;font-size:2.2rem;font-weight:300;letter-spacing:-.02em;flex:1;}
.vote-timer-wrap{position:relative;width:80px;height:80px;flex-shrink:0;}
.vote-timer-wrap svg{transform:rotate(-90deg);}
.vote-timer-num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'DM Mono',monospace;font-size:1.1rem;}
.bars-area{flex:1;display:flex;flex-direction:column;justify-content:center;gap:0;padding:0 5rem;}
.bar-block{display:flex;flex-direction:column;gap:1rem;padding:2.5rem 0;border-bottom:2px solid var(--paper3);}
.bar-block:last-child{border-bottom:none;}
.bar-movie-name{font-family:'DM Mono',monospace;font-size:2rem;font-weight:400;letter-spacing:-.01em;}
.bar-track{height:24px;background:var(--paper3);border-radius:3px;overflow:hidden;}
.bar-fill{height:100%;border-radius:3px;transition:width .8s cubic-bezier(.34,1.2,.64,1);min-width:6px;width:0%;}
.vote-voters{font-family:'DM Mono',monospace;font-size:1rem;color:var(--mute);margin-left:auto;}

/* ── REVEAL ── */
#sReveal{align-items:center;justify-content:center;}
.reveal-inner{width:min(860px,90vw);}
.reveal-eyebrow{font-family:'DM Mono',monospace;font-size:1rem;letter-spacing:.2em;text-transform:uppercase;color:var(--mute);margin-bottom:1.5rem;}
.reveal-winner{font-family:'DM Mono',monospace;font-size:4.5rem;font-weight:300;line-height:1.1;letter-spacing:-.03em;margin-bottom:3rem;}
.reveal-list{display:flex;flex-direction:column;gap:10px;margin-bottom:3rem;}
.reveal-row{display:flex;align-items:center;gap:2rem;padding:1.5rem 2rem;border-radius:var(--r);}
.reveal-row.r1{background:var(--ink);color:var(--paper);}
.reveal-row.r2{background:var(--paper2);border:2px solid var(--ink);}
.reveal-row.r3{background:var(--paper2);border:2px solid var(--line);}
.reveal-rank{font-family:'DM Mono',monospace;font-size:1rem;color:var(--mute);width:28px;}
.reveal-row.r1 .reveal-rank{color:var(--ghost);}
.reveal-name{flex:1;font-size:1.5rem;font-weight:500;}
.reveal-bar{flex:0 0 200px;height:8px;background:var(--ghost);border-radius:4px;overflow:hidden;}
.reveal-bar-fill{height:100%;background:var(--paper);border-radius:4px;}
.reveal-row.r2 .reveal-bar-fill,.reveal-row.r3 .reveal-bar-fill{background:var(--ink);}

/* ── MOBILE ── */
#sMobile{overflow-y:auto;}
.m-wrap{width:100%;max-width:520px;margin:0 auto;padding:2rem 1.5rem;}
.m-card{background:var(--paper);border:2px solid var(--ink);border-radius:var(--r);padding:2.5rem;}
.m-brand{display:flex;align-items:center;gap:10px;margin-bottom:2rem;}
.m-brand-stripe{width:4px;height:22px;background:var(--red);}
.m-brand-stripe2{width:4px;height:22px;background:var(--blue);}
.m-brand strong{font-family:'DM Mono',monospace;font-size:1rem;font-weight:500;letter-spacing:.04em;}
.m-label{display:block;font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin-bottom:8px;}
.m-input{width:100%;background:var(--paper2);border:2px solid var(--line);border-radius:var(--r);padding:14px 16px;color:var(--ink);font-family:'DM Sans',sans-serif;font-size:18px;outline:none;transition:border .2s;margin-bottom:1rem;}
.m-input:focus{border-color:var(--ink);}
.m-input::placeholder{color:var(--ghost);}
.m-btn{width:100%;padding:18px;background:var(--ink);color:var(--paper);font-family:'DM Sans',sans-serif;font-size:18px;font-weight:500;border:none;border-radius:var(--r);cursor:pointer;transition:opacity .15s,transform .1s;}
.m-btn:hover{opacity:.82;}
.m-btn:active{transform:scale(.98);}
.m-state{text-align:center;padding:2rem 0;}
.m-state h3{font-family:'DM Mono',monospace;font-size:1.2rem;font-weight:400;margin-bottom:.6rem;}
.m-state p{font-size:16px;color:var(--mute);line-height:1.7;}
.chip{background:var(--ink);color:var(--paper);border-radius:var(--r);padding:6px 12px;font-family:'DM Mono',monospace;font-size:13px;}
.m-add-row{display:grid;grid-template-columns:1fr auto;gap:10px;margin-bottom:1.25rem;}
.m-add-input{width:100%;background:var(--paper2);border:2px solid var(--line);border-radius:var(--r);padding:14px 16px;color:var(--ink);font-family:'DM Sans',sans-serif;font-size:18px;outline:none;transition:border .2s;}
.m-add-input:focus{border-color:var(--ink);}
.m-add-input::placeholder{color:var(--ghost);}
.m-add-btn{padding:14px 20px;background:var(--ink);color:var(--paper);font-family:'DM Mono',monospace;font-size:24px;border:none;border-radius:var(--r);cursor:pointer;transition:opacity .15s;}
.m-add-btn:hover{opacity:.75;}
.m-movie-list{display:flex;flex-direction:column;gap:10px;margin-bottom:1.5rem;}
.m-movie-item{display:flex;align-items:center;gap:12px;padding:18px;background:var(--ink);border-radius:var(--r);animation:chipIn .22s ease;}
.m-movie-item span{font-family:'DM Mono',monospace;font-size:18px;color:var(--paper);flex:1;line-height:1.3;}
.m-movie-remove{background:transparent;border:none;color:var(--mute);font-family:'DM Mono',monospace;font-size:20px;cursor:pointer;padding:0 4px;line-height:1;transition:color .15s;flex-shrink:0;}
.m-movie-remove:hover{color:var(--paper);}
.m-movie-empty{font-size:15px;color:var(--ghost);font-style:italic;padding:8px 0;margin-bottom:1.25rem;}
.vote-list{display:flex;flex-direction:column;gap:14px;margin-bottom:1rem;}
.v-card{border:2px solid var(--line);border-radius:var(--r);padding:20px;background:var(--paper2);}
.v-card-title{font-size:20px;font-weight:500;margin-bottom:16px;line-height:1.3;}
.v-thumbs{display:flex;gap:10px;}
.v-thumb-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:20px 10px;border-radius:var(--r);border:2px solid var(--line);background:var(--paper);cursor:pointer;transition:all .15s;font-family:'DM Mono',monospace;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);}
.v-thumb-btn:hover{border-color:var(--ink);color:var(--ink);}
.v-thumb-icon{font-size:32px;line-height:1;}
.v-thumb-btn.up-active{border-color:var(--grn);background:#e8f9ee;color:#1a8040;}
.v-thumb-btn.dn-active{border-color:var(--red);background:#fce9e6;color:#a0301f;}
.m-metro-badge{display:flex;align-items:center;gap:10px;margin-bottom:1.5rem;}
.m-metro-dot{width:12px;height:12px;border-radius:50%;}
</style>
</head>
<body>

<!-- LOBBY -->
<div class="scr on" id="sLobby">
  <div class="metro-bar red" style="height:5px;flex-shrink:0;"></div>
  <div style="display:flex;flex:1;overflow:hidden;">
    <div class="lobby-qr-side">
      <div style="display:flex;align-items:center;gap:12px;align-self:flex-start;">
        <div style="width:4px;height:32px;background:var(--red);"></div>
        <div style="width:4px;height:32px;background:var(--blue);"></div>
        <span class="mono" style="font-size:1.3rem;font-weight:500;letter-spacing:.04em;">movie night</span>
      </div>
      <div class="qr-frame-big" id="qrBox"></div>
      <div style="text-align:center;">
        <div class="lobby-title">Scan to join</div>
        <p class="lobby-hint" style="margin-top:.5rem;">Everyone scans, then the host starts.</p>
      </div>
    </div>
    <div class="lobby-players-side">
      <div>
        <div class="label" style="margin-bottom:.75rem;">Players joined</div>
        <div class="player-count-big" id="pCount">0</div>
      </div>
      <div style="width:100%;height:3px;background:var(--ink);"></div>
      <div class="player-grid" id="playerGrid">
        <span style="font-size:15px;color:var(--ghost);font-style:italic;">Waiting for players...</span>
      </div>
      <div class="lobby-action">
        <button class="btn" style="flex:1;" id="mainBtn" onclick="hostStartSubmissions()">Start submissions</button>
        <button class="btn-ghost" onclick="hostReset()">Reset</button>
      </div>
    </div>
  </div>
</div>

<!-- FISHBOWL SUBMISSION -->
<div class="scr" id="sSubmit">
  <div class="metro-bar blue" style="height:5px;flex-shrink:0;"></div>
  <div class="submit-top">
    <div>
      <div class="label" style="margin-bottom:.4rem;">phase 02 — submissions</div>
      <div class="submit-title">What's going in the bowl?</div>
    </div>
    <div style="display:flex;align-items:center;gap:2rem;">
      <div>
        <div class="label" style="margin-bottom:.3rem;">Movies added</div>
        <div class="mono" style="font-size:2.8rem;font-weight:300;" id="mCount">0</div>
      </div>
      <div class="timer-ring-wrap">
        <svg width="90" height="90" viewBox="0 0 90 90">
          <circle fill="none" stroke="#e0dbd0" stroke-width="6" cx="45" cy="45" r="36"/>
          <circle id="subRingArc" fill="none" stroke="#0e0e12" stroke-width="6" stroke-linecap="round"
            cx="45" cy="45" r="36" stroke-dasharray="226.2" stroke-dashoffset="0"/>
        </svg>
        <div class="timer-ring-num" id="subTime">3:00</div>
      </div>
    </div>
  </div>
  <div class="fishbowl-area">
    <canvas id="fishCanvas"></canvas>
  </div>
  <div style="padding:1.5rem 4rem;border-top:2px solid var(--paper3);display:flex;gap:1rem;justify-content:flex-end;flex-shrink:0;">
    <button class="btn" onclick="hostStartVoting()">Start voting now</button>
    <button class="btn-ghost" onclick="hostReset()">Reset</button>
  </div>
</div>

<!-- HOST VOTE -->
<div class="scr" id="sHostVote">
  <div class="metro-bar" style="height:5px;flex-shrink:0;background:var(--grn);"></div>
  <div class="vote-top">
    <div>
      <div class="label" style="margin-bottom:.4rem;">phase 03 — voting</div>
      <div class="vote-title">Vote on your phone</div>
    </div>
    <div class="vote-voters" id="vCount">0 voters</div>
    <div class="vote-timer-wrap">
      <svg width="80" height="80" viewBox="0 0 80 80">
        <circle fill="none" stroke="#e0dbd0" stroke-width="6" cx="40" cy="40" r="32"/>
        <circle id="voteRingArc" fill="none" stroke="#0e0e12" stroke-width="6" stroke-linecap="round"
          cx="40" cy="40" r="32" stroke-dasharray="201.1" stroke-dashoffset="0"/>
      </svg>
      <div class="vote-timer-num" id="voteTime">1:30</div>
    </div>
    <div style="display:flex;gap:1rem;">
      <button class="btn" style="font-size:15px;padding:14px 24px;" onclick="hostEndVoting()">Reveal</button>
      <button class="btn-ghost" style="font-size:15px;padding:14px 24px;" onclick="hostReset()">Reset</button>
    </div>
  </div>
  <div class="bars-area" id="barsArea"></div>
</div>

<!-- REVEAL -->
<div class="scr" id="sReveal">
  <div class="metro-bar" style="height:5px;flex-shrink:0;background:var(--ylw);"></div>
  <div style="flex:1;display:flex;align-items:center;justify-content:center;padding:4rem;">
    <div class="reveal-inner">
      <div class="reveal-eyebrow">Tonight's pick</div>
      <div class="reveal-winner" id="revTitle">...</div>
      <div style="height:3px;background:var(--ink);margin-bottom:2rem;"></div>
      <div class="reveal-list" id="revList"></div>
      <button class="btn" onclick="hostReset()">New night</button>
    </div>
  </div>
</div>

<!-- MOBILE -->
<div class="scr" id="sMobile">
  <div class="metro-bar red" style="height:5px;flex-shrink:0;"></div>
  <div style="flex:1;overflow-y:auto;padding:2rem 1.25rem;">
    <div class="m-wrap">
      <div class="m-card">
        <div class="m-brand">
          <div class="m-brand-stripe"></div>
          <div class="m-brand-stripe2"></div>
          <strong>movie night</strong>
        </div>
        <div id="mContent"></div>
      </div>
    </div>
  </div>
</div>

<script>
const ROOM_ID = 'room_' + getOrMakeRoom();
const DB_URL = 'https://sidequest-movie-night-default-rtdb.europe-west1.firebasedatabase.app/';
function getOrMakeRoom(){
  const p = new URLSearchParams(location.search);
  if(p.get('room')) return p.get('room');
  const id = Math.random().toString(36).slice(2,8);
  const u = new URL(location.href);
  u.searchParams.set('room', id);
  history.replaceState({},''  ,u);
  return id;
}
const IS_MOBILE = new URLSearchParams(location.search).has('vote');
const PHASE1_SECS = 180;
const PHASE2_SECS = 90;
const CIRC_SUB = 226.2;
const CIRC_VOTE = 201.1;

const BASE = `${DB_URL}/${ROOM_ID}`;
async function dbGet(p=''){const r=await fetch(`${BASE}${p}.json`);return r.ok?r.json():null;}
async function dbSet(p,d){await fetch(`${BASE}${p}.json`,{method:'PUT',body:JSON.stringify(d)});}
async function dbPatch(p,d){await fetch(`${BASE}${p}.json`,{method:'PATCH',body:JSON.stringify(d)});}
async function dbDelete(p=''){await fetch(`${BASE}${p}.json`,{method:'DELETE'});}

let G = {};
let intervals = [];
function clearAll(){intervals.forEach(clearInterval);intervals=[];}
function tick(fn,ms){const id=setInterval(fn,ms);intervals.push(id);return id;}
function esc(s){const d=document.createElement('div');d.textContent=s||'';return d.innerHTML;}

let currentScr = null;
function show(id){
  if(currentScr){
    const old = document.getElementById(currentScr);
    if(old){old.classList.add('out');setTimeout(()=>old.classList.remove('on','out'),520);}
  }
  setTimeout(()=>{
    const el = document.getElementById(id);
    if(el){el.classList.add('on');}
    currentScr = id;
  }, currentScr ? 300 : 0);
}

const BAR_COLORS = ['#d63e2a','#2a6dd6','#2ab85a'];

// ── PHYSICS FISHBOWL ──
let physBalls = [];
let physRAF = null;
let physCanvas = null;
let physCtx = null;
let bowlW = 0, bowlH = 0;
const GRAVITY = 0.35;
const DAMPING = 0.62;
const FRICTION = 0.985;
const FONT_SIZES = [28, 32, 36, 40];

function initPhysics(){
  physCanvas = document.getElementById('fishCanvas');
  if(!physCanvas) return;
  const area = physCanvas.parentElement;
  const W = area.clientWidth - 80;
  const H = area.clientHeight - 20;
  bowlW = W; bowlH = H;
  physCanvas.width = W;
  physCanvas.height = H;
  physCtx = physCanvas.getContext('2d');
  physBalls = [];
  if(physRAF) cancelAnimationFrame(physRAF);
  physLoop();
}

function addBall(text){
  if(!physCanvas) return;
  const fs = FONT_SIZES[Math.floor(Math.random()*FONT_SIZES.length)];
  physCtx.font = `500 ${fs}px 'DM Mono', monospace`;
  const tw = physCtx.measureText(text).width;
  const pw = tw + 28;
  const ph = fs + 20;
  const r = Math.max(pw, ph) / 2;
  const x = Math.random()*(bowlW - pw*1.5) + pw*0.75;
  const ball = {
    x, y: -ph,
    vx: (Math.random()-.5)*3,
    vy: 1,
    text, fs,
    pw, ph, r,
    rotation: (Math.random()-.5)*.3,
    rotV: (Math.random()-.5)*.04,
    color: ['#0e0e12','#d63e2a','#2a6dd6'][Math.floor(Math.random()*3)],
    id: Math.random()
  };
  physBalls.push(ball);
}

function physLoop(){
  if(!physCtx) return;
  physCtx.clearRect(0,0,bowlW,bowlH);

  // bowl outline
  physCtx.save();
  physCtx.strokeStyle = '#0e0e12';
  physCtx.lineWidth = 3;
  physCtx.beginPath();
  const bx = bowlW/2, by = bowlH/2;
  const rx = bowlW/2 - 6, ry = bowlH/2 - 6;
  physCtx.ellipse(bx, by, rx, ry, 0, 0, Math.PI*2);
  physCtx.stroke();
  // clip to bowl
  physCtx.beginPath();
  physCtx.ellipse(bx, by, rx-2, ry-2, 0, 0, Math.PI*2);
  physCtx.clip();

  for(let i=0;i<physBalls.length;i++){
    const b = physBalls[i];
    b.vy += GRAVITY;
    b.vx *= FRICTION;
    b.rotV *= 0.98;
    b.x += b.vx;
    b.y += b.vy;
    b.rotation += b.rotV;

    // ellipse wall collision
    const dx = (b.x - bx) / (rx - b.r*0.6);
    const dy = (b.y - by) / (ry - b.r*0.6);
    const dist = Math.sqrt(dx*dx + dy*dy);
    if(dist > 1){
      const nx = dx/dist, ny = dy/dist;
      b.x = bx + nx*(rx - b.r*0.6) * (bowlW/bowlW);
      b.y = by + ny*(ry - b.r*0.6) * (bowlH/bowlH);
      const dot = b.vx*nx + b.vy*ny;
      b.vx = (b.vx - 2*dot*nx)*DAMPING;
      b.vy = (b.vy - 2*dot*ny)*DAMPING;
      b.rotV += (Math.random()-.5)*0.1;
    }

    // ball-ball collisions
    for(let j=i+1;j<physBalls.length;j++){
      const o = physBalls[j];
      const ddx = o.x - b.x, ddy = o.y - b.y;
      const dd = Math.sqrt(ddx*ddx+ddy*ddy);
      const minD = (b.r + o.r) * 0.72;
      if(dd < minD && dd > 0.01){
        const nx2 = ddx/dd, ny2 = ddy/dd;
        const overlap = minD - dd;
        b.x -= nx2*overlap*0.5; b.y -= ny2*overlap*0.5;
        o.x += nx2*overlap*0.5; o.y += ny2*overlap*0.5;
        const dvx = b.vx-o.vx, dvy = b.vy-o.vy;
        const imp = (dvx*nx2+dvy*ny2)*0.55;
        b.vx -= imp*nx2; b.vy -= imp*ny2;
        o.vx += imp*nx2; o.vy += imp*ny2;
        b.rotV += imp*0.08; o.rotV -= imp*0.08;
      }
    }

    // draw pill
    physCtx.save();
    physCtx.translate(b.x, b.y);
    physCtx.rotate(b.rotation);
    const hw = b.pw/2, hh = b.ph/2;
    physCtx.beginPath();
    physCtx.roundRect(-hw,-hh,b.pw,b.ph,hh);
    physCtx.fillStyle = b.color;
    physCtx.fill();
    physCtx.fillStyle = '#f5f2eb';
    physCtx.font = `500 ${b.fs}px 'DM Mono', monospace`;
    physCtx.textAlign = 'center';
    physCtx.textBaseline = 'middle';
    physCtx.fillText(b.text, 0, 1);
    physCtx.restore();
  }

  physCtx.restore();
  physRAF = requestAnimationFrame(physLoop);
}

// ── HOST LOBBY ──
async function hostLobby(){
  show('sLobby');
  const voterUrl = new URL(location.href);
  voterUrl.searchParams.set('vote','1');
  voterUrl.searchParams.set('room', ROOM_ID.replace('room_',''));
  const vUrl = voterUrl.toString();
  const qrBox = document.getElementById('qrBox');
  qrBox.innerHTML='';
  const sz = Math.min(Math.round(window.innerWidth*0.36), 440);
  try{new QRCode(qrBox,{text:vUrl,width:sz,height:sz,colorDark:'#000',colorLight:'#fff',correctLevel:QRCode.CorrectLevel.M});}
  catch(e){qrBox.textContent='QR error';}

  let state = await dbGet('/state');
  if(!state||state.phase==='reveal'){
    state={phase:'waiting',waitStart:Date.now(),p1Start:null,submissions:{},movies:[],votes:{},voters:{}};
    await dbSet('/state',state);
  }
  G=state;
  updateLobbyUI();
  tick(async()=>{
    G=await dbGet('/state')||G;
    updateLobbyUI();
    if(G.phase==='submitting'){clearAll();hostSubmitScreen();}
    if(G.phase==='voting'){clearAll();hostVote();}
    if(G.phase==='reveal'){clearAll();showReveal();}
  },2000);
}

function updateLobbyUI(){
  const subs = G.submissions?Object.values(G.submissions):[];
  document.getElementById('pCount').textContent = subs.length;
  const grid = document.getElementById('playerGrid');
  if(subs.length===0){
    grid.innerHTML='<span style="font-size:16px;color:var(--ghost);font-style:italic;">Waiting for players...</span>';
    return;
  }
  grid.innerHTML=subs.map(s=>`<div class="player-chip">${esc(s.name)}</div>`).join('');
}

async function hostStartSubmissions(){
  clearAll();
  G=await dbGet('/state')||G;
  if(G.phase!=='waiting')return;
  const ns={...G,phase:'submitting',p1Start:Date.now()};
  await dbSet('/state',ns);
  G=ns;
  hostSubmitScreen();
}

function hostSubmitScreen(){
  show('sSubmit');
  setTimeout(()=>initPhysics(),350);

  // rebuild balls from existing submissions
  const seenMovies = new Set();
  if(G.submissions){
    Object.values(G.submissions).forEach(s=>(s.movies||[]).forEach(m=>{
      if(!seenMovies.has(m)){seenMovies.add(m);setTimeout(()=>addBall(m),100+Math.random()*300);}
    }));
  }

  let prevMovies = new Set(seenMovies);

  tick(async()=>{
    G=await dbGet('/state')||G;
    if(G.phase==='voting'){clearAll();if(physRAF)cancelAnimationFrame(physRAF);hostVote();return;}
    const subs=G.submissions?Object.values(G.submissions):[];
    const allMovies=[];
    subs.forEach(s=>(s.movies||[]).forEach(m=>allMovies.push(m)));
    document.getElementById('mCount').textContent=allMovies.length;
    allMovies.forEach(m=>{if(!prevMovies.has(m)){prevMovies.add(m);addBall(m);}});

    if(G.p1Start){
      const elapsed=Math.min((Date.now()-G.p1Start)/1000,PHASE1_SECS);
      const rem=Math.max(0,PHASE1_SECS-elapsed);
      const mm=Math.floor(rem/60),ss=Math.round(rem%60);
      document.getElementById('subTime').textContent=`${mm}:${String(ss).padStart(2,'0')}`;
      document.getElementById('subRingArc').style.strokeDashoffset=CIRC_SUB*(1-rem/PHASE1_SECS);
      if(elapsed>=PHASE1_SECS){clearAll();await hostStartVoting();}
    }
  },2000);
}

async function hostStartVoting(){
  clearAll();
  if(physRAF)cancelAnimationFrame(physRAF);
  G=await dbGet('/state')||G;
  if(G.phase!=='submitting')return;
  let all=[];
  const subs=G.submissions?Object.values(G.submissions):[];
  subs.forEach(s=>(s.movies||[]).forEach(m=>all.push(m)));
  const defaults=['The Dark Knight','Inception','Parasite','Pulp Fiction','Interstellar','Get Out','The Matrix','Goodfellas','Whiplash','La La Land'];
  while(all.length<3)all.push(defaults[Math.floor(Math.random()*defaults.length)]);
  const picked=all.sort(()=>Math.random()-.5).slice(0,3);
  const votes={};
  picked.forEach(m=>{votes[m]=0;});
  const ns={...G,phase:'voting',p2Start:Date.now(),movies:picked,votes,voters:{}};
  await dbSet('/state',ns);
  G=ns;
  hostVote();
}

// ── HOST VOTE ──
function hostVote(){
  show('sHostVote');
  renderBars();
  tick(async()=>{
    G=await dbGet('/state')||G;
    if(G.phase!=='voting'){clearAll();return;}
    renderBars();
    updateVoteRing();
    const elapsed=(Date.now()-G.p2Start)/1000;
    if(elapsed>=PHASE2_SECS){clearAll();await hostEndVoting();}
  },1500);
}

function renderBars(){
  const mv=G.movies||[], vt=G.votes||{};
  const vc=G.voters?Object.keys(G.voters).filter(k=>G.voters[k]).length:0;
  document.getElementById('vCount').textContent=`${vc} voter${vc===1?'':'s'}`;
  const scores=mv.map(m=>vt[m]||0);
  // normalise: shift so min maps to 0, scale to 0-100%
  const minS=Math.min(...scores);
  const maxS=Math.max(...scores);
  const range=maxS-minS||1;

  document.getElementById('barsArea').innerHTML=mv.map((m,i)=>{
    const pct=Math.round(((scores[i]-minS)/range)*85+5);
    return `<div class="bar-block">
      <div class="bar-movie-name">${esc(m)}</div>
      <div class="bar-track">
        <div class="bar-fill" id="bf${i}" style="width:${pct}%;background:${BAR_COLORS[i]};"></div>
      </div>
    </div>`;
  }).join('');
}

function updateVoteRing(){
  const elapsed=(Date.now()-G.p2Start)/1000;
  const rem=Math.max(0,PHASE2_SECS-elapsed);
  const mm=Math.floor(rem/60),ss=Math.round(rem%60);
  document.getElementById('voteTime').textContent=`${mm}:${String(ss).padStart(2,'0')}`;
  document.getElementById('voteRingArc').style.strokeDashoffset=CIRC_VOTE*(1-rem/PHASE2_SECS);
}

async function hostEndVoting(){
  G=await dbGet('/state')||G;
  G.phase='reveal';
  await dbPatch('/state',{phase:'reveal'});
  showReveal();
}

// ── REVEAL ──
function showReveal(){
  show('sReveal');
  const mv=G.movies||[], vt=G.votes||{};
  const sorted=[...mv].sort((a,b)=>(vt[b]||0)-(vt[a]||0));
  document.getElementById('revTitle').textContent=sorted[0]||'...';
  const maxSc=Math.max(...sorted.map(m=>vt[m]||0),1);
  const rankClass=['r1','r2','r3'];
  const rankLabel=['01','02','03'];
  document.getElementById('revList').innerHTML=sorted.map((m,i)=>{
    const sc=vt[m]||0;
    const pct=Math.round((sc/maxSc)*100);
    return `<div class="reveal-row ${rankClass[i]||'r3'}">
      <span class="reveal-rank mono">${rankLabel[i]||'--'}</span>
      <span class="reveal-name">${esc(m)}</span>
      <div class="reveal-bar"><div class="reveal-bar-fill" style="width:${pct}%"></div></div>
    </div>`;
  }).join('');
}

async function hostReset(){
  clearAll();
  if(physRAF)cancelAnimationFrame(physRAF);
  await dbDelete();
  location.href=location.pathname;
}

// ── MOBILE ──
let myName='',myMovies=[],myVotes={},joined=false;
let mPoll=null;
let lastSentVotes={};

async function mobileInit(){
  show('sMobile');
  G=await dbGet('/state')||{};
  const ph=G.phase||'waiting';
  if(ph==='waiting'){joined?renderMWait():renderMJoin();}
  else if(ph==='submitting'){renderMSubmit();}
  else if(ph==='voting'){renderMVote();}
  else if(ph==='reveal'){renderMReveal();}
}

function renderMJoin(){
  document.getElementById('mContent').innerHTML=`
    <div class="m-metro-badge"><div class="m-metro-dot" style="background:var(--red)"></div><span class="m-label" style="margin-bottom:0;">join lobby</span></div>
    <label class="m-label">Your name</label>
    <input class="m-input" id="mName" placeholder="Enter your name..." maxlength="30"/>
    <button class="m-btn" onclick="mJoin()">Join</button>`;
  if(myName)document.getElementById('mName').value=myName;
  document.getElementById('mName').addEventListener('keydown',e=>{if(e.key==='Enter')mJoin();});
  pollUntil(['submitting','voting','reveal']);
}

async function mJoin(){
  const name=(document.getElementById('mName').value||'').trim();
  if(!name){alert('Enter your name!');return;}
  myName=name;
  const key=name.replace(/[.#$/\[\]]/g,'_');
  await dbSet(`/state/submissions/${key}`,{name,movies:[]});
  joined=true;
  renderMWait();
}

function renderMWait(){
  document.getElementById('mContent').innerHTML=`
    <div class="m-state">
      <h3>You're in</h3>
      <p>Waiting for the host to open submissions...</p>
      <div style="margin-top:1.5rem;"><div class="m-label" style="margin-bottom:.5rem;">Logged in as</div><div class="chip">${esc(myName)}</div></div>
    </div>`;
  pollUntil(['submitting','voting','reveal']);
}

function renderMSubmit(){
  if(mPoll)clearInterval(mPoll);
  document.getElementById('mContent').innerHTML=`
    <div class="m-metro-badge"><div class="m-metro-dot" style="background:var(--blue)"></div><span class="m-label" style="margin-bottom:0;">add your picks</span></div>
    <p style="font-family:'DM Mono',monospace;font-size:12px;letter-spacing:.08em;color:var(--mute);margin-bottom:1.25rem;">as ${esc(myName)}</p>
    <div class="m-movie-list" id="mMovieList"></div>
    <div class="m-add-row">
      <input class="m-add-input" id="mMovieInput" placeholder="Type a movie..." maxlength="80" autocomplete="off"/>
      <button class="m-add-btn" onclick="mAddMovie()">+</button>
    </div>
    <p style="font-size:13px;color:var(--ghost);text-align:center;font-family:'DM Mono',monospace;">add as many as you like</p>`;
  document.getElementById('mMovieInput').addEventListener('keydown',e=>{if(e.key==='Enter')mAddMovie();});
  renderMMovieList();
  pollUntil(['voting','reveal']);
}

function renderMMovieList(){
  const el=document.getElementById('mMovieList');
  if(!el)return;
  if(myMovies.length===0){el.innerHTML='<p class="m-movie-empty">No picks yet</p>';return;}
  el.innerHTML=myMovies.map((m,i)=>`
    <div class="m-movie-item">
      <span>${esc(m)}</span>
      <button class="m-movie-remove" onclick="mRemoveMovie(${i})">x</button>
    </div>`).join('');
}

async function mAddMovie(){
  const input=document.getElementById('mMovieInput');
  if(!input)return;
  const val=(input.value||'').trim();
  if(!val)return;
  myMovies.push(val);
  input.value='';input.focus();
  renderMMovieList();
  const key=myName.replace(/[.#$/\[\]]/g,'_');
  await dbSet(`/state/submissions/${key}`,{name:myName,movies:[...myMovies]});
}

async function mRemoveMovie(idx){
  myMovies.splice(idx,1);
  renderMMovieList();
  const key=myName.replace(/[.#$/\[\]]/g,'_');
  await dbSet(`/state/submissions/${key}`,{name:myName,movies:[...myMovies]});
}

function renderMVote(){
  if(mPoll)clearInterval(mPoll);
  const mv=G.movies||[];
  myVotes={};lastSentVotes={};
  document.getElementById('mContent').innerHTML=`
    <div class="m-metro-badge"><div class="m-metro-dot" style="background:var(--grn)"></div><span class="m-label" style="margin-bottom:0;">vote</span></div>
    <p style="font-family:'DM Mono',monospace;font-size:12px;letter-spacing:.08em;color:var(--mute);margin-bottom:1.5rem;">as ${esc(myName)} — vote however you like</p>
    <div class="vote-list" id="vList">
      ${mv.map((m,i)=>`
        <div class="v-card" id="vc${i}">
          <div class="v-card-title">${esc(m)}</div>
          <div class="v-thumbs">
            <button class="v-thumb-btn" id="up${i}" onclick="toggleV(${i},1)">
              <span class="v-thumb-icon">👍</span><span>for it</span>
            </button>
            <button class="v-thumb-btn" id="dn${i}" onclick="toggleV(${i},-1)">
              <span class="v-thumb-icon">👎</span><span>against</span>
            </button>
          </div>
        </div>`).join('')}
    </div>
    <div style="font-family:'DM Mono',monospace;font-size:12px;color:var(--mute);text-align:center;padding:.75rem 0;" id="vStatus">Tap to vote on any movie</div>`;
  pollUntil(['reveal']);
}

async function toggleV(idx,dir){
  const mv=G.movies||[];
  const m=mv[idx];
  if(myVotes[m]===dir){delete myVotes[m];}else{myVotes[m]=dir;}
  updateVoteUI();
  await pushVoteDiff(mv);
}

function updateVoteUI(){
  const mv=G.movies||[];
  mv.forEach((m2,i)=>{
    const upB=document.getElementById('up'+i);
    const dnB=document.getElementById('dn'+i);
    if(!upB)return;
    upB.classList.toggle('up-active',myVotes[m2]===1);
    dnB.classList.toggle('dn-active',myVotes[m2]===-1);
  });
  const total=Object.keys(myVotes).length;
  const st=document.getElementById('vStatus');
  if(!st)return;
  if(total===0){st.textContent='Tap to vote on any movie';}
  else{
    const ups=Object.values(myVotes).filter(v=>v===1).length;
    const dns=Object.values(myVotes).filter(v=>v===-1).length;
    const parts=[];if(ups>0)parts.push(`${ups} for`);if(dns>0)parts.push(`${dns} against`);
    st.textContent=parts.join(', ')+' — votes live';
  }
}

async function pushVoteDiff(mv){
  const key=myName.replace(/[.#$/\[\]]/g,'_');
  const currentVotes=await dbGet('/state/votes')||{};
  const patch={};
  for(const [m,v] of Object.entries(lastSentVotes)){patch[m]=(currentVotes[m]||0)-v;}
  for(const [m,v] of Object.entries(myVotes)){const base=patch[m]!==undefined?patch[m]:(currentVotes[m]||0);patch[m]=base+v;}
  lastSentVotes={...myVotes};
  await dbPatch('/state/voters',{[key]:Object.keys(myVotes).length>0});
  if(Object.keys(patch).length>0)await dbPatch('/state/votes',patch);
}

function pollUntil(phases){
  if(mPoll)clearInterval(mPoll);
  mPoll=setInterval(async()=>{
    const st=await dbGet('/state');
    if(!st)return;
    G=st;
    if(phases.includes(st.phase)){clearInterval(mPoll);mobileInit();}
  },2500);
}

function renderMReveal(){
  if(mPoll)clearInterval(mPoll);
  const mv=G.movies||[],vt=G.votes||{};
  const sorted=[...mv].sort((a,b)=>(vt[b]||0)-(vt[a]||0));
  document.getElementById('mContent').innerHTML=`
    <div class="m-state">
      <div class="m-label" style="margin-bottom:.75rem;">Tonight's pick</div>
      <h3 style="font-size:1.4rem;font-family:'DM Mono',monospace;font-weight:300;">${esc(sorted[0]||'...')}</h3>
    </div>`;
}

(async function boot(){
  if(IS_MOBILE){await mobileInit();}
  else{
    const st=await dbGet('/state');
    G=st||{};
    if(G.phase==='voting'){hostVote();}
    else if(G.phase==='submitting'){hostSubmitScreen();}
    else if(G.phase==='reveal'){showReveal();}
    else{hostLobby();}
  }
})();
</script>
