<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Movie Night</title>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=DM+Sans:wght@300;400;500;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --ink:#0e0e12;--paper:#f5f2eb;--paper2:#ede9e0;--paper3:#e0dbd0;
  --line:#c8c2b4;--mute:#9a9488;--ghost:#b8b2a6;
  --red:#d63e2a;--blue:#2a6dd6;--grn:#2ab85a;--ylw:#d6a42a;--r:3px;
}
html,body{height:100%;width:100%;overflow:hidden;background:var(--paper);color:var(--ink);font-family:'DM Sans',system-ui,sans-serif;}

.map-bg{position:fixed;inset:0;pointer-events:none;z-index:0;}
.map-bg svg{width:100%;height:100%;opacity:.09;}

.scr{position:fixed;inset:0;display:flex;flex-direction:column;
  opacity:0;pointer-events:none;
  transition:opacity .55s ease,transform .55s ease;
  transform:scale(1.018);background:var(--paper);z-index:1;}
.scr.on{opacity:1;pointer-events:all;transform:scale(1);}
.scr.out{opacity:0;transform:scale(.982);}

.mono{font-family:'DM Mono',monospace;}
.label{font-family:'DM Mono',monospace;font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute);}
.btn{display:inline-flex;align-items:center;justify-content:center;background:var(--ink);color:var(--paper);border:none;border-radius:var(--r);padding:18px 36px;font-family:'DM Sans',sans-serif;font-size:18px;font-weight:500;letter-spacing:.04em;cursor:pointer;transition:opacity .15s,transform .1s;}
.btn:hover{opacity:.82;}
.btn:active{transform:scale(.97);}
.btn-ghost{display:inline-flex;align-items:center;justify-content:center;background:transparent;color:var(--mute);border:2.5px solid var(--line);border-radius:var(--r);padding:18px 36px;font-family:'DM Sans',sans-serif;font-size:18px;cursor:pointer;transition:all .15s;}
.btn-ghost:hover{border-color:var(--ink);color:var(--ink);}

/* LOBBY */
#sLobby{flex-direction:row;}
.lobby-left{flex:0 0 54%;border-right:3px solid var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.5rem;padding:3rem;}
.lobby-brand{display:flex;align-items:center;gap:12px;align-self:flex-start;}
.lobby-brand-bar{width:5px;height:36px;}
.lobby-brand-title{font-family:'DM Mono',monospace;font-size:1.5rem;font-weight:500;letter-spacing:.04em;}
.qr-outer{background:#fff;border:3px solid var(--ink);border-radius:var(--r);padding:14px;display:flex;align-items:center;justify-content:center;}
.lobby-scan-label{font-family:'DM Mono',monospace;font-size:1.1rem;font-weight:400;letter-spacing:.04em;color:var(--mute);text-align:center;}
.lobby-right{flex:1;display:flex;flex-direction:column;padding:3rem 3.5rem;gap:0;overflow:hidden;}
.lobby-player-count{font-family:'DM Mono',monospace;font-size:7rem;font-weight:300;line-height:1;letter-spacing:-.04em;margin-bottom:.25rem;}
.lobby-player-label{font-family:'DM Mono',monospace;font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute);margin-bottom:2rem;}
.lobby-divider{height:3px;background:var(--ink);margin-bottom:2rem;}
.player-chips{display:flex;flex-wrap:wrap;gap:10px;flex:1;align-content:flex-start;overflow:hidden;}
.player-chip{display:flex;align-items:center;gap:9px;font-family:'DM Mono',monospace;font-size:1.05rem;border:2.5px solid var(--ink);border-radius:var(--r);padding:10px 16px;animation:chipIn .35s cubic-bezier(.34,1.56,.64,1);}
.player-chip-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
@keyframes chipIn{from{opacity:0;transform:scale(.75);}to{opacity:1;transform:scale(1);}}
.lobby-actions{margin-top:auto;display:flex;gap:1rem;}

/* SUBMISSIONS */
#sSubmit{flex-direction:column;}
.submit-header{display:flex;align-items:center;justify-content:space-between;padding:2rem 4rem;border-bottom:3px solid var(--ink);flex-shrink:0;}
.submit-header-left{display:flex;align-items:center;gap:2rem;}
.submit-phase{font-family:'DM Mono',monospace;font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute);}
.submit-headline{font-family:'DM Mono',monospace;font-size:2.2rem;font-weight:300;letter-spacing:-.02em;}
.submit-stat-block{text-align:right;}
.submit-count-big{font-family:'DM Mono',monospace;font-size:4rem;font-weight:300;line-height:1;letter-spacing:-.04em;}
.fish-stage{flex:1;position:relative;overflow:hidden;display:flex;align-items:stretch;justify-content:center;}
#fishCanvas{display:block;width:100%;height:100%;}
.fish-timer{position:absolute;bottom:2.5rem;right:3rem;font-family:'DM Mono',monospace;font-size:5rem;font-weight:300;letter-spacing:-.04em;line-height:1;color:var(--ink);opacity:.18;pointer-events:none;}
.submit-footer{padding:1.5rem 4rem;border-top:2.5px solid var(--paper3);display:flex;gap:1rem;justify-content:flex-end;flex-shrink:0;}

/* HOST VOTE */
#sHostVote{flex-direction:column;}
.vote-header{display:flex;align-items:center;gap:2.5rem;padding:2.5rem 5rem;border-bottom:3px solid var(--ink);flex-shrink:0;}
.vote-header-title{font-family:'DM Mono',monospace;font-size:1.1rem;font-weight:400;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);flex:1;}
.vote-voter-pill{font-family:'DM Mono',monospace;font-size:1.1rem;letter-spacing:.08em;border:2.5px solid var(--ink);border-radius:var(--r);padding:8px 20px;}
.vote-ring-wrap{position:relative;width:72px;height:72px;flex-shrink:0;}
.vote-ring-wrap svg{transform:rotate(-90deg);}
.vote-ring-num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'DM Mono',monospace;font-size:1rem;font-weight:400;}
.vote-btns{display:flex;gap:1rem;}
.vote-bars-area{flex:1;display:flex;flex-direction:column;justify-content:stretch;padding:0;}
.vote-bar-row{flex:1;display:flex;align-items:center;border-bottom:2.5px solid var(--paper3);padding:0 5rem;gap:4rem;transition:background .3s;}
.vote-bar-row:last-child{border-bottom:none;}
.vote-bar-row.leading{background:var(--paper2);}
.vote-bar-movie{font-family:'DM Mono',monospace;font-size:2.4rem;font-weight:400;flex:0 0 38%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.01em;}
.vote-bar-track-wrap{flex:1;display:flex;flex-direction:column;gap:.6rem;}
.vote-bar-track{height:28px;background:var(--paper3);border-radius:3px;overflow:hidden;position:relative;}
.vote-bar-fill{height:100%;border-radius:3px;transition:width 1s cubic-bezier(.34,1.2,.64,1);min-width:6px;width:3%;}
.vote-bar-dot{width:18px;height:18px;border-radius:50%;border:3px solid var(--ink);flex-shrink:0;}

/* REVEAL */
#sReveal{align-items:center;justify-content:center;}
.reveal-wrap{width:min(900px,90vw);}
.reveal-eyebrow{font-family:'DM Mono',monospace;font-size:1.1rem;letter-spacing:.2em;text-transform:uppercase;color:var(--mute);margin-bottom:1.25rem;}
.reveal-winner-text{font-family:'DM Mono',monospace;font-size:5.5rem;font-weight:300;line-height:1.05;letter-spacing:-.03em;margin-bottom:2.5rem;}
.reveal-rule{height:3px;background:var(--ink);margin-bottom:2.5rem;}
.reveal-list{display:flex;flex-direction:column;gap:12px;margin-bottom:2.5rem;}
.reveal-row{display:flex;align-items:center;gap:2rem;padding:1.6rem 2.2rem;border-radius:var(--r);}
.reveal-row.r1{background:var(--ink);color:var(--paper);}
.reveal-row.r2{background:var(--paper2);border:2.5px solid var(--ink);}
.reveal-row.r3{background:var(--paper2);border:2.5px solid var(--line);}
.reveal-rank{font-family:'DM Mono',monospace;font-size:1rem;width:32px;color:var(--mute);}
.reveal-row.r1 .reveal-rank{color:var(--ghost);}
.reveal-rname{flex:1;font-size:1.6rem;font-weight:500;}
.reveal-dot{width:16px;height:16px;border-radius:50%;flex-shrink:0;}
.reveal-row.r1 .reveal-dot{border:2.5px solid var(--paper);}
.reveal-row.r2 .reveal-dot,.reveal-row.r3 .reveal-dot{border:2.5px solid var(--ink);}

/* MOBILE */
#sMobile{overflow-y:auto;}
.m-scroll{padding:2rem 1.25rem;min-height:100%;display:flex;flex-direction:column;align-items:center;}
.m-card{background:var(--paper);border:2.5px solid var(--ink);border-radius:var(--r);padding:2.5rem;width:100%;max-width:520px;}
.m-brand{display:flex;align-items:center;gap:10px;margin-bottom:2.25rem;}
.m-brand-bar{width:4px;height:22px;}
.m-brand-title{font-family:'DM Mono',monospace;font-size:1rem;font-weight:500;letter-spacing:.04em;}
.m-label{display:block;font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin-bottom:8px;}
.m-input{width:100%;background:var(--paper2);border:2px solid var(--line);border-radius:var(--r);padding:16px;color:var(--ink);font-family:'DM Sans',sans-serif;font-size:18px;outline:none;transition:border .2s;margin-bottom:1rem;}
.m-input:focus{border-color:var(--ink);}
.m-input::placeholder{color:var(--ghost);}
.m-btn{width:100%;padding:18px;background:var(--ink);color:var(--paper);font-family:'DM Sans',sans-serif;font-size:18px;font-weight:500;border:none;border-radius:var(--r);cursor:pointer;transition:opacity .15s,transform .1s;}
.m-btn:hover{opacity:.82;}
.m-btn:active{transform:scale(.98);}
.m-state{text-align:center;padding:2rem 0;}
.m-state h3{font-family:'DM Mono',monospace;font-size:1.25rem;font-weight:400;margin-bottom:.75rem;}
.m-state p{font-size:16px;color:var(--mute);line-height:1.7;}
.m-chip{background:var(--ink);color:var(--paper);border-radius:var(--r);padding:7px 14px;font-family:'DM Mono',monospace;font-size:14px;display:inline-block;}
.m-phase-badge{display:flex;align-items:center;gap:10px;margin-bottom:1.75rem;}
.m-phase-dot{width:13px;height:13px;border-radius:50%;flex-shrink:0;}
.m-phase-label{font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);}
.m-add-row{display:grid;grid-template-columns:1fr auto;gap:10px;margin-bottom:1.25rem;}
.m-add-input{width:100%;background:var(--paper2);border:2px solid var(--line);border-radius:var(--r);padding:16px;color:var(--ink);font-family:'DM Sans',sans-serif;font-size:18px;outline:none;transition:border .2s;}
.m-add-input:focus{border-color:var(--ink);}
.m-add-input::placeholder{color:var(--ghost);}
.m-add-btn{padding:16px 20px;background:var(--ink);color:var(--paper);font-family:'DM Mono',monospace;font-size:26px;border:none;border-radius:var(--r);cursor:pointer;transition:opacity .15s;line-height:1;}
.m-add-btn:hover{opacity:.75;}
.m-movie-list{display:flex;flex-direction:column;gap:10px;margin-bottom:1.5rem;}
.m-movie-item{display:flex;align-items:center;gap:14px;padding:18px 20px;background:var(--ink);border-radius:var(--r);animation:chipIn .22s ease;}
.m-movie-item span{font-family:'DM Mono',monospace;font-size:18px;color:var(--paper);flex:1;line-height:1.3;}
.m-movie-rm{background:transparent;border:none;color:var(--ghost);font-family:'DM Mono',monospace;font-size:22px;cursor:pointer;padding:0 4px;line-height:1;transition:color .15s;}
.m-movie-rm:hover{color:var(--paper);}
.m-movie-empty{font-size:15px;color:var(--ghost);font-style:italic;padding:8px 0;margin-bottom:1.25rem;}
.mv-list{display:flex;flex-direction:column;gap:16px;margin-bottom:1rem;}
.mv-card{border:2.5px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--paper2);}
.mv-card-header{display:flex;align-items:center;gap:14px;padding:20px 22px;}
.mv-card-dot{width:13px;height:13px;border-radius:50%;flex-shrink:0;}
.mv-card-title{font-size:20px;font-weight:500;flex:1;line-height:1.3;}
.mv-btns{display:grid;grid-template-columns:1fr 1fr;border-top:2px solid var(--line);}
.mv-btn{padding:22px;display:flex;align-items:center;justify-content:center;cursor:pointer;border:none;background:var(--paper);font-size:36px;line-height:1;transition:all .15s;}
.mv-btn:first-child{border-right:1px solid var(--line);}
.mv-btn:hover{background:var(--paper2);}
.mv-btn.up-on{background:#e6f9ed;}
.mv-btn.dn-on{background:#fce8e5;}
.mv-status{font-family:'DM Mono',monospace;font-size:12px;letter-spacing:.08em;color:var(--mute);text-align:center;padding:.75rem 0;}
</style>
</head>
<body>

<div class="map-bg">
<svg viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
  <polyline points="80,200 280,200 420,340 680,340 820,480 1100,480" fill="none" stroke="#d63e2a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="160,80 160,320 320,480 600,480 800,280 1050,280" fill="none" stroke="#2a6dd6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="0,560 300,560 480,380 700,380 900,560 1200,560" fill="none" stroke="#2ab85a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="200,700 400,500 600,500 780,700" fill="none" stroke="#d6a42a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="280" cy="200" r="7" fill="white" stroke="#d63e2a" stroke-width="3"/>
  <circle cx="420" cy="340" r="9" fill="white" stroke="#0e0e12" stroke-width="3"/>
  <circle cx="680" cy="340" r="7" fill="white" stroke="#d63e2a" stroke-width="3"/>
  <circle cx="160" cy="320" r="7" fill="white" stroke="#2a6dd6" stroke-width="3"/>
  <circle cx="320" cy="480" r="9" fill="white" stroke="#0e0e12" stroke-width="3"/>
  <circle cx="600" cy="480" r="11" fill="white" stroke="#0e0e12" stroke-width="3"/>
  <circle cx="800" cy="280" r="7" fill="white" stroke="#2a6dd6" stroke-width="3"/>
  <circle cx="480" cy="380" r="7" fill="white" stroke="#2ab85a" stroke-width="3"/>
  <circle cx="700" cy="380" r="7" fill="white" stroke="#2ab85a" stroke-width="3"/>
  <circle cx="400" cy="500" r="9" fill="white" stroke="#0e0e12" stroke-width="3"/>
  <circle cx="600" cy="500" r="7" fill="white" stroke="#d6a42a" stroke-width="3"/>
  <circle cx="820" cy="480" r="7" fill="white" stroke="#d63e2a" stroke-width="3"/>
</svg>
</div>

<!-- LOBBY -->
<div class="scr" id="sLobby">
  <div class="lobby-left">
    <div class="lobby-brand">
      <div class="lobby-brand-bar" style="background:var(--red)"></div>
      <div class="lobby-brand-bar" style="background:var(--blue)"></div>
      <span class="lobby-brand-title">movie night</span>
    </div>
    <div class="qr-outer" id="qrBox"></div>
    <div class="lobby-scan-label">Scan to join on your phone</div>
  </div>
  <div class="lobby-right">
    <div class="lobby-player-count" id="pCount">0</div>
    <div class="lobby-player-label">players joined</div>
    <div class="lobby-divider"></div>
    <div class="player-chips" id="playerChips">
      <span id="lobbyEmpty" style="font-size:16px;color:var(--ghost);font-style:italic;font-family:'DM Mono',monospace;">waiting for players...</span>
    </div>
    <div class="lobby-actions">
      <button class="btn" style="flex:1;" onclick="hostStartSubmissions()">Start submissions</button>
      <button class="btn-ghost" onclick="hostReset()">Reset</button>
    </div>
  </div>
</div>

<!-- SUBMISSIONS -->
<div class="scr" id="sSubmit">
  <div class="submit-header">
    <div class="submit-header-left">
      <div>
        <div class="submit-phase">phase 02</div>
        <div class="submit-headline">Drop your movies in</div>
      </div>
    </div>
    <div class="submit-stat-block">
      <div class="label" style="margin-bottom:.3rem;">movies added</div>
      <div class="submit-count-big" id="fishMCount">0</div>
    </div>
  </div>
  <div class="fish-stage">
    <canvas id="fishCanvas"></canvas>
    <div class="fish-timer" id="fishTimer">3:00</div>
  </div>
  <div class="submit-footer">
    <button class="btn" onclick="hostStartVoting()">Start voting now</button>
    <button class="btn-ghost" onclick="hostReset()">Reset</button>
  </div>
</div>

<!-- HOST VOTE -->
<div class="scr" id="sHostVote">
  <div class="vote-header">
    <span class="vote-header-title">movie night — vote on your phone</span>
    <div class="vote-voter-pill" id="vCount">0 voters</div>
    <div class="vote-ring-wrap">
      <svg width="72" height="72" viewBox="0 0 72 72">
        <circle fill="none" stroke="#e0dbd0" stroke-width="5" cx="36" cy="36" r="28"/>
        <circle id="vRingArc" fill="none" stroke="#0e0e12" stroke-width="5" stroke-linecap="round"
          cx="36" cy="36" r="28" stroke-dasharray="175.93" stroke-dashoffset="0"/>
      </svg>
      <div class="vote-ring-num" id="vRingTime">1:30</div>
    </div>
    <div class="vote-btns">
      <button class="btn" style="font-size:16px;padding:14px 28px;" onclick="hostEndVoting()">Reveal</button>
      <button class="btn-ghost" style="font-size:16px;padding:14px 28px;" onclick="hostReset()">Reset</button>
    </div>
  </div>
  <div class="vote-bars-area" id="vBarsArea"></div>
</div>

<!-- REVEAL -->
<div class="scr" id="sReveal">
  <div style="flex:1;display:flex;align-items:center;justify-content:center;padding:4rem;">
    <div class="reveal-wrap" id="revealWrap">
    </div>
  </div>
</div>

<!-- MOBILE -->
<div class="scr" id="sMobile">
  <div class="m-scroll">
    <div class="m-card">
      <div class="m-brand">
        <div class="m-brand-bar" style="background:var(--red)"></div>
        <div class="m-brand-bar" style="background:var(--blue)"></div>
        <span class="m-brand-title">movie night</span>
      </div>
      <div id="mContent"></div>
    </div>
  </div>
</div>

<script>
const ROOM_ID='room_'+getOrMakeRoom();
const DB_URL='https://sidequest-movie-night-default-rtdb.europe-west1.firebasedatabase.app/';
function getOrMakeRoom(){
  const p=new URLSearchParams(location.search);
  if(p.get('room'))return p.get('room');
  const id=Math.random().toString(36).slice(2,8);
  const u=new URL(location.href);u.searchParams.set('room',id);
  history.replaceState({},''  ,u);return id;
}
const IS_MOBILE=new URLSearchParams(location.search).has('vote');
const P1=180,P2=90,CIRC_V=175.93;
const BASE=`${DB_URL}/${ROOM_ID}`;
async function dbGet(p=''){const r=await fetch(`${BASE}${p}.json`);return r.ok?r.json():null;}
async function dbSet(p,d){await fetch(`${BASE}${p}.json`,{method:'PUT',body:JSON.stringify(d)});}
async function dbPatch(p,d){await fetch(`${BASE}${p}.json`,{method:'PATCH',body:JSON.stringify(d)});}
async function dbDelete(p=''){await fetch(`${BASE}${p}.json`,{method:'DELETE'});}
let G={},ivs=[];
function clearAll(){ivs.forEach(clearInterval);ivs=[];}
function tick(fn,ms){const id=setInterval(fn,ms);ivs.push(id);return id;}
function esc(s){const d=document.createElement('div');d.textContent=s||'';return d.innerHTML;}

// Proper Fisher-Yates shuffle — fixes "always picks first 3 movies" bug
function shuffle(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

const CHIP_COLORS=['var(--red)','var(--blue)','var(--grn)','var(--ylw)','var(--ink)'];
const BAR_COLORS=['#d63e2a','#2a6dd6','#2ab85a'];

let activeScr=null;
function show(id){
  if(activeScr&&activeScr!==id){
    const old=document.getElementById(activeScr);
    old.classList.add('out');
    setTimeout(()=>{old.classList.remove('on','out');},580);
  }
  setTimeout(()=>{
    const el=document.getElementById(id);
    el.classList.add('on');
    activeScr=id;
  },activeScr?280:0);
}

/* ══ PHYSICS U-BOWL ══ */
let balls=[],raf=null,cvs=null,ctx=null,CW=0,CH=0;
const GRAV=0.38,DAMP=0.48,FRIC=0.978;
const BALL_R_MIN=52,BALL_R_MAX=72;
const PILL_COLORS=['#0e0e12','#d63e2a','#2a6dd6','#2ab85a','#8b5cf6','#d6a42a'];

// FIX 1: Bowl has a max-width so it doesn't stretch across wide screens.
// It sits centred in the canvas; we store an x-offset for that.
let uBowl={x:0,y:0,w:0,h:0,rx:0};
const BOWL_MAX_W=820;

function getUBowl(){
  const pad=40;
  const rawW=CW-pad*2;
  const w=Math.min(rawW,BOWL_MAX_W);
  const x=Math.round((CW-w)/2); // centred
  const y=Math.round(CH*0.06);
  const h=CH-y-pad;
  const rx=Math.min(w*0.18,h*0.28);
  return{x,y,w,h,rx};
}

function initFish(){
  cvs=document.getElementById('fishCanvas');
  if(!cvs)return;
  const stage=cvs.parentElement;
  CW=stage.clientWidth;CH=stage.clientHeight;
  cvs.width=CW;cvs.height=CH;
  ctx=cvs.getContext('2d');
  uBowl=getUBowl();
  balls=[];
  if(raf)cancelAnimationFrame(raf);
  fishLoop();
}
function resolveUBowl(b){
  const {x,y,w,h,rx}=uBowl;
  const right=x+w;
  const bottom=y+h;

  // HARD LEFT WALL
  if(b.x - b.r < x){
    b.x = x + b.r;
    b.vx = Math.abs(b.vx) * DAMP;
  }

  // HARD RIGHT WALL
  if(b.x + b.r > right){
    b.x = right - b.r;
    b.vx = -Math.abs(b.vx) * DAMP;
  }

  // PREVENT ESCAPING ABOVE THE RIM
  if(b.y < y + b.r){
    b.y = y + b.r;
    b.vy = Math.abs(b.vy) * 0.2;
  }

  const innerBottom = bottom-rx;
  const innerLeft = x+rx;
  const innerRight = right-rx;

function dropBall(text){
  if(!cvs||!ctx)return;
  const r=BALL_R_MIN+Math.random()*(BALL_R_MAX-BALL_R_MIN);
  const col=PILL_COLORS[Math.floor(Math.random()*PILL_COLORS.length)];
  const{x,w}=uBowl;
  balls.push({
    x:x+w*0.2+Math.random()*w*0.6,
    y:-r*2-10,
    vx:(Math.random()-.5)*4,vy:0,
    text,r,col,
    highlight:false,selected:false
  });
}

function removeBall(text){
  const idx=balls.findIndex(b=>b.text===text);
  if(idx!==-1)balls.splice(idx,1);
}

function drawUBowlOutline(){
  const{x,y,w,h,rx}=uBowl;
  const right=x+w,bottom=y+h;
  ctx.beginPath();
  ctx.moveTo(x, y);
  ctx.lineTo(x, bottom-rx);
  ctx.arcTo(x, bottom, x+rx, bottom, rx);
  ctx.lineTo(right-rx, bottom);
  ctx.arcTo(right, bottom, right, bottom-rx, rx);
  ctx.lineTo(right, y);
  ctx.strokeStyle='#0e0e12';
  ctx.lineWidth=3;
  ctx.stroke();
}

function fishLoop(){
  if(!ctx)return;
  ctx.clearRect(0,0,CW,CH);
  drawUBowlOutline();

  const{x,y,w,h,rx}=uBowl;
  const right=x+w,bottom=y+h;
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(x,y);
  ctx.lineTo(x,bottom-rx);
  ctx.arcTo(x,bottom,x+rx,bottom,rx);
  ctx.lineTo(right-rx,bottom);
  ctx.arcTo(right,bottom,right,bottom-rx,rx);
  ctx.lineTo(right,y);
  ctx.lineTo(x,y);
  ctx.clip();

  for(let i=0;i<balls.length;i++){
    const b=balls[i];
    b.vy+=GRAV;b.vx*=FRIC;b.vy*=FRIC;
    b.x+=b.vx;b.y+=b.vy;
    // Emergency recovery for escaped balls
    if(
      b.x < -500 ||
      b.x > CW + 500 ||
      b.y > CH + 500 ||
      b.y < -500
    ){
      balls.splice(i,1);
      i--;
      continue;
    }
    resolveUBowl(b);

    for(let j=i+1;j<balls.length;j++){
      const o=balls[j];
      const ddx=o.x-b.x,ddy=o.y-b.y,dd=Math.hypot(ddx,ddy);
      const md=b.r+o.r+1;
      if(dd<md&&dd>0.01){
        const nx=ddx/dd,ny=ddy/dd,ov=(md-dd)*0.5;
        b.x-=nx*ov;b.y-=ny*ov;o.x+=nx*ov;o.y+=ny*ov;
        const dv=(b.vx-o.vx)*nx+(b.vy-o.vy)*ny,imp=dv*0.5;
        b.vx-=imp*nx;b.vy-=imp*ny;o.vx+=imp*nx;o.vy+=imp*ny;
      }
    }

    ctx.save();
    ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);
    if(b.selected){
      ctx.fillStyle='#f5f2eb';ctx.fill();
      ctx.strokeStyle=b.col;ctx.lineWidth=5;ctx.stroke();
    } else if(b.highlight){
      ctx.fillStyle=b.col;ctx.fill();
      ctx.strokeStyle='#f5f2eb';ctx.lineWidth=4;ctx.stroke();
    } else {
      ctx.fillStyle=b.col;ctx.fill();
    }

    const maxW=(b.r*2)-22;
    const textColor=b.selected?b.col:'#f5f2eb';
    ctx.fillStyle=textColor;
    ctx.textAlign='center';
    ctx.textBaseline='middle';

    const words=b.text.split(' ');
    let lines=[];
    if(words.length===1){lines=[b.text];}
    else{const mid=Math.ceil(words.length/2);lines=[words.slice(0,mid).join(' '),words.slice(mid).join(' ')];}

    let fs=18;
    ctx.font=`500 ${fs}px 'DM Mono',monospace`;
    while(fs>11&&lines.some(l=>ctx.measureText(l).width>maxW)){
      fs--;ctx.font=`500 ${fs}px 'DM Mono',monospace`;
    }

    const lineH=fs*1.25,totalH=(lines.length-1)*lineH;
    lines.forEach((line,li)=>{ctx.fillText(line,b.x,b.y-totalH/2+li*lineH);});
    ctx.restore();
  }
  ctx.restore();
  raf=requestAnimationFrame(fishLoop);
  const validMovies = new Set();

if(G.submissions){
  Object.values(G.submissions).forEach(s=>{
    (s.movies || []).forEach(m=>validMovies.add(m));
  });
}

balls = balls.filter(b => validMovies.has(b.text));
}

/* ══ SELECTION ANIMATION ══ */
// FIX 2: animating is a flag the DB poll checks — it won't navigate away mid-animation
let animating=false;

async function runSelectionAnimation(picked){
  animating=true;
  return new Promise(resolve=>{
    const total=balls.length;
    if(!total){animating=false;resolve();return;}
    let hlIdx=0,cycleCount=0,maxCycles=total*4+14;
    const currentMovies = G.movies || [];
    const shuffled = shuffle(
      balls.filter(b => currentMovies.includes(b.text))
    );
    const cycle=setInterval(()=>{
      balls.forEach(b=>{b.highlight=false;b.selected=false;});
      const b=shuffled[hlIdx%shuffled.length];
      if(b)b.highlight=true;
      hlIdx++;cycleCount++;
      if(cycleCount>=maxCycles){
        clearInterval(cycle);
        balls.forEach(b=>{b.highlight=false;});
        let pi=0;
        const reveal=setInterval(()=>{
          if(pi>=picked.length){
            clearInterval(reveal);
            setTimeout(()=>{animating=false;resolve();},1000);
            return;
          }
          const target=balls.find(b=>b.text===picked[pi]);
          if(target)target.selected=true;
          pi++;
        },750);
      }
    },85);
  });
}

}

let seenMovies=new Set();
let submitTimerIv=null;

function hostSubmitScreen(){
  show('sSubmit');
  seenMovies=new Set();

  setTimeout(()=>{
    initFish();
    if(G.submissions)Object.values(G.submissions).forEach(s=>(s.movies||[]).forEach(m=>{
      if(!seenMovies.has(m)){seenMovies.add(m);setTimeout(()=>dropBall(m),100+Math.random()*400);}
    }));
  },380);

  if(submitTimerIv)clearInterval(submitTimerIv);
  submitTimerIv=setInterval(()=>{
    if(!G.p1Start)return;
    const el=Math.min((Date.now()-G.p1Start)/1000,P1);
    const rem=Math.max(0,P1-el);
    const mm=Math.floor(rem/60),ss=Math.floor(rem%60);
    const timerEl=document.getElementById('fishTimer');
    if(timerEl)timerEl.textContent=`${mm}:${String(ss).padStart(2,'0')}`;
  },1000);
  ivs.push(submitTimerIv);

  tick(async()=>{
    G=await dbGet('/state')||G;
    // FIX 2: Don't navigate away if the selection animation is running
    if(G.phase==='voting'){
      if(!animating){clearAll();if(raf)cancelAnimationFrame(raf);hostVote();}
      return;
    }
    const subs=G.submissions?Object.values(G.submissions):[];
    const allM=[];subs.forEach(s=>(s.movies||[]).forEach(m=>allM.push(m)));

    allM.forEach(m=>{if(!seenMovies.has(m)){seenMovies.add(m);dropBall(m);}});
    seenMovies.forEach(m=>{
      if(!allM.includes(m)){seenMovies.delete(m);removeBall(m);}
    });

    document.getElementById('fishMCount').textContent=allM.length;

    if(G.p1Start&&(Date.now()-G.p1Start)/1000>=P1){
      clearAll();await hostStartVoting();
    }
  },2000);
}

async function hostStartVoting(){
  clearAll();
  G=await dbGet('/state')||G;
  if(G.phase!=='submitting')return;

  let all=[];
  const subs=G.submissions?Object.values(G.submissions):[];
  subs.forEach(s=>(s.movies||[]).forEach(m=>all.push(m)));
  const defaults=['The Dark Knight','Inception','Parasite','Pulp Fiction','Interstellar','Get Out','The Matrix','Goodfellas','Whiplash','La La Land'];
  while(all.length<3)all.push(defaults[Math.floor(Math.random()*defaults.length)]);

  // FIX 3: Use proper Fisher-Yates shuffle instead of .sort(() => Math.random() - 0.5)
  const picked=shuffle(all).slice(0,3);

  const votes={};picked.forEach(m=>{votes[m]=0;});
  const ns={...G,phase:'voting',p2Start:Date.now(),movies:picked,votes,voters:{}};
  await dbSet('/state',ns);G=ns;

  await runSelectionAnimation(picked);
  if(raf)cancelAnimationFrame(raf);
  hostVote();
}

function renderVoteBars(){
  const mv=G.movies||[],vt=G.votes||{};

  document.getElementById('vCount').textContent=`${vc} voter${vc===1?'':'s'}`;

  document.getElementById('vBarsArea').innerHTML=mv.map((m,i)=>{
    const pct=Math.round(((scores[i]-minS)/range)*80+10);
    const isLead=i===winner&&vc>0;
    return `<div class="vote-bar-row${isLead?' leading':''}">
      <div class="vote-bar-movie">${esc(m)}</div>
      <div class="vote-bar-track-wrap">

          <div class="vote-bar-fill" style="width:${pct}%;background:${BAR_COLORS[i]};"></div>

      <div class="vote-bar-dot" style="background:${isLead?BAR_COLORS[i]:'var(--paper2)'};border-color:${isLead?BAR_COLORS[i]:'var(--ink)'};"></div>
    </div>`;
  }).join('');
}

function updateVoteRing(){

/* ══ REVEAL ══ */
function showReveal(){
  const mv=G.movies||[],vt=G.votes||{};
  const sorted=[...mv].sort((a,b)=>(vt[b]||0)-(vt[a]||0));
  const topScore=vt[sorted[0]]||0;
  const tied=sorted.filter(m=>(vt[m]||0)===topScore);
  if(tied.length>1){runCoinFlip(tied,sorted);}
  else{renderReveal(sorted);}
}

function runCoinFlip(tied,sorted){
  show('sReveal');
  const wrap=document.getElementById('revealWrap');
  wrap.innerHTML=`
    <div class="reveal-eyebrow">It's a tie — flipping a coin</div>
    <div style="display:flex;align-items:center;justify-content:center;margin:2.5rem 0;">
      <canvas id="coinCanvas" width="160" height="160"></canvas>
    </div>
    <div class="reveal-rule"></div>
    <div id="coinStatus" style="font-family:'DM Mono',monospace;font-size:1.3rem;font-weight:300;text-align:center;letter-spacing:-.01em;color:var(--mute);">
      deciding between ${tied.map(m=>`<strong style="color:var(--ink)">${esc(m)}</strong>`).join(' vs ')}...
    </div>`;

  const c=document.getElementById('coinCanvas');
  const cx=c.getContext('2d');
  let frame=0,totalFrames=90;
  const winner=tied[Math.floor(Math.random()*tied.length)];
  let side=true;

  function drawCoin(scaleX){
    cx.clearRect(0,0,160,160);
    cx.save();cx.translate(80,80);cx.scale(scaleX,1);
    cx.beginPath();cx.arc(0,0,62,0,Math.PI*2);
    cx.fillStyle=side?'#0e0e12':'#d6a42a';cx.fill();
    if(Math.abs(scaleX)>0.15){
      cx.fillStyle='#f5f2eb';cx.font=`500 28px 'DM Mono',monospace`;
      cx.textAlign='center';cx.textBaseline='middle';
      cx.fillText(side?'?':'!',0,1);
    }
    cx.restore();
  }

  const anim=setInterval(()=>{
    frame++;
    const progress=frame/totalFrames;
    const speed=progress<0.65?1:1-((progress-0.65)/0.35)*0.88;
    const angle=frame*speed*0.28;
    const scaleX=Math.cos(angle);
    if(Math.cos(angle-speed*0.28)*scaleX<0)side=!side;
    drawCoin(scaleX);
    if(frame>=totalFrames){
      clearInterval(anim);drawCoin(1);
      document.getElementById('coinStatus').innerHTML=`<span style="color:var(--mute);font-size:1rem;font-family:'DM Mono',monospace;">the coin lands...</span>`;
      setTimeout(()=>{const finalSorted=[winner,...sorted.filter(m=>m!==winner)];renderReveal(finalSorted);},1000);
    }
  },16);
}

function renderReveal(sorted){
  show('sReveal');
  const mv=G.movies||[],vt=G.votes||{};
  const wrap=document.getElementById('revealWrap');
  const rc=['r1','r2','r3'],rl=['01','02','03'];
  wrap.innerHTML=`
    <div class="reveal-eyebrow">Tonight's pick</div>
    <div class="reveal-winner-text">${esc(sorted[0]||'...')}</div>
    <div class="reveal-rule"></div>
    <div class="reveal-list">
      ${sorted.map((m,i)=>{
        const col=BAR_COLORS[mv.indexOf(m)]||'var(--ink)';
        return `<div class="reveal-row ${rc[i]||'r3'}">
          <span class="reveal-rank mono">${rl[i]||'—'}</span>
          <div class="reveal-dot" style="background:${rc[i]==='r1'?'transparent':col};border-color:${rc[i]==='r1'?'var(--paper)':col};"></div>
          <span class="reveal-rname">${esc(m)}</span>
        </div>`;
      }).join('')}
    </div>
    <button class="btn" onclick="hostReset()">New night</button>`;
}

}

function mUpdateVoteUI(){
  const mv=G.movies||[];
  mv.forEach((m,i)=>{
    document.getElementById('up'+i)?.classList.toggle('up-on',myVotes[m]===1);
    document.getElementById('dn'+i)?.classList.toggle('dn-on',myVotes[m]===-1);
  });
  const total=Object.keys(myVotes).length;
  const st=document.getElementById('mvStatus');if(!st)return;
  if(!total){st.textContent='Tap to vote';return;}
  const ups=Object.values(myVotes).filter(v=>v===1).length;
  const dns=Object.values(myVotes).filter(v=>v===-1).length;
  const parts=[];if(ups)parts.push(`${ups} 👍`);if(dns)parts.push(`${dns} 👎`);
  st.textContent=parts.join('  ·  ')+' — live';
}

async function mPushVote(mv){
  const key=myName.replace(/[.#$/\[\]]/g,'_');
  const cur=await dbGet('/state/votes')||{};
  const patch={};
  for(const[m,v]of Object.entries(lastSent))patch[m]=(cur[m]||0)-v;
  for(const[m,v]of Object.entries(myVotes)){const b=patch[m]!==undefined?patch[m]:(cur[m]||0);patch[m]=b+v;}
  lastSent={...myVotes};
  await dbPatch('/state/voters',{[key]:Object.keys(myVotes).length>0});
  if(Object.keys(patch).length)await dbPatch('/state/votes',patch);
}

function mRevealScreen(){
  if(mPoll)clearInterval(mPoll);
  const mv=G.movies||[],vt=G.votes||{};
  const sorted=[...mv].sort((a,b)=>(vt[b]||0)-(vt[a]||0));
  document.getElementById('mContent').innerHTML=`
    <div class="m-state">
      <div class="m-label" style="margin-bottom:.75rem;">Tonight's pick</div>
      <h3 style="font-size:1.5rem;font-family:'DM Mono',monospace;font-weight:300;">${esc(sorted[0]||'...')}</h3>
    </div>`;
}

function pollUntil(phases){
  if(mPoll)clearInterval(mPoll);
  mPoll=setInterval(async()=>{
    const st=await dbGet('/state');if(!st)return;G=st;
    if(phases.includes(st.phase)){clearInterval(mPoll);mobileInit();}
  },2500);
}

(async function boot(){
  if(IS_MOBILE){await mobileInit();}
  else{
    const st=await dbGet('/state');G=st||{};
    if(G.phase==='voting')hostVote();
    else if(G.phase==='submitting')hostSubmitScreen();
    else if(G.phase==='reveal')showReveal();
    else hostLobby();
  }
})();
</script>
</body>
