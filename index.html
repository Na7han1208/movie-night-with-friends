<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Movie Night — pick a film together</title>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=DM+Sans:wght@300;400;500;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --ink:#0e0e12;--paper:#f5f2eb;--paper2:#ede9e0;--paper3:#e0dbd0;
  --line:#c8c2b4;--mute:#9a9488;--ghost:#b8b2a6;
  --red:#d63e2a;--blue:#2a6dd6;--grn:#2ab85a;--ylw:#d6a42a;--r:3px;
}
html,body{height:100%;width:100%;overflow:hidden;background:var(--paper);color:var(--ink);font-family:'DM Sans',system-ui,sans-serif;}

/* MAP BG */
.map-bg{position:fixed;inset:0;pointer-events:none;z-index:0;}
.map-bg svg{width:100%;height:100%;opacity:.09;}

/* SCREENS */
.scr{position:fixed;inset:0;display:flex;flex-direction:column;
  opacity:0;pointer-events:none;
  transition:opacity .55s ease,transform .55s ease;
  transform:scale(1.018);background:var(--paper);z-index:1;}
.scr.on{opacity:1;pointer-events:all;transform:scale(1);}
.scr.out{opacity:0;transform:scale(.982);}

.mono{font-family:'DM Mono',monospace;}
.label{font-family:'DM Mono',monospace;font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute);}
.btn{display:inline-flex;align-items:center;justify-content:center;background:var(--ink);color:var(--paper);border:none;border-radius:var(--r);padding:18px 36px;font-family:'DM Sans',sans-serif;font-size:18px;font-weight:500;letter-spacing:.04em;cursor:pointer;transition:opacity .15s,transform .1s;}
.btn:hover{opacity:.82;}
.btn:active{transform:scale(.97);}
.btn-ghost{display:inline-flex;align-items:center;justify-content:center;background:transparent;color:var(--mute);border:2.5px solid var(--line);border-radius:var(--r);padding:18px 36px;font-family:'DM Sans',sans-serif;font-size:18px;cursor:pointer;transition:all .15s;}
.btn-ghost:hover{border-color:var(--ink);color:var(--ink);}

/* LOBBY */
#sLobby{flex-direction:row;}
.lobby-left{
  flex:0 0 54%;border-right:3px solid var(--ink);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:2.5rem;padding:3rem;
}
.lobby-brand{display:flex;align-items:center;gap:12px;align-self:flex-start;}
.lobby-brand-bar{width:5px;height:36px;}
.lobby-brand-title{font-family:'DM Mono',monospace;font-size:1.5rem;font-weight:500;letter-spacing:.04em;}
.qr-outer{background:#fff;border:3px solid var(--ink);border-radius:var(--r);padding:14px;display:flex;align-items:center;justify-content:center;}
.lobby-scan-label{font-family:'DM Mono',monospace;font-size:1.1rem;font-weight:400;letter-spacing:.04em;color:var(--mute);text-align:center;}

.lobby-right{flex:1;display:flex;flex-direction:column;padding:3rem 3.5rem;gap:0;overflow:hidden;}
.lobby-player-count{font-family:'DM Mono',monospace;font-size:7rem;font-weight:300;line-height:1;letter-spacing:-.04em;margin-bottom:.25rem;}
.lobby-player-label{font-family:'DM Mono',monospace;font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute);margin-bottom:2rem;}
.lobby-divider{height:3px;background:var(--ink);margin-bottom:2rem;}
.player-chips{display:flex;flex-wrap:wrap;gap:10px;flex:1;align-content:flex-start;overflow-y:auto;max-height:50vh;}
.player-chip{
  display:flex;align-items:center;gap:9px;
  font-family:'DM Mono',monospace;font-size:1.05rem;
  border:2.5px solid var(--ink);border-radius:var(--r);
  padding:10px 16px;
  animation:chipIn .35s cubic-bezier(.34,1.56,.64,1);
}
.player-chip-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
@keyframes chipIn{from{opacity:0;transform:scale(.75);}to{opacity:1;transform:scale(1);}}
.lobby-actions{margin-top:auto;display:flex;gap:1rem;}

/* SUBMISSIONS */
#sSubmit{flex-direction:column;}
.submit-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:2rem 4rem;border-bottom:3px solid var(--ink);flex-shrink:0;
}
.submit-header-left{display:flex;align-items:center;gap:2rem;}
.submit-phase{font-family:'DM Mono',monospace;font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute);}
.submit-headline{font-family:'DM Mono',monospace;font-size:2.2rem;font-weight:300;letter-spacing:-.02em;}
.submit-stat-block{text-align:right;}
.submit-count-big{font-family:'DM Mono',monospace;font-size:4rem;font-weight:300;line-height:1;letter-spacing:-.04em;}
.fish-stage{flex:1;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;}
#fishCanvas{display:block;width:100%;height:100%;}
.fish-timer{
  position:absolute;bottom:2.5rem;right:3rem;
  font-family:'DM Mono',monospace;font-size:5rem;font-weight:300;letter-spacing:-.04em;line-height:1;
  color:var(--ink);opacity:.18;pointer-events:none;
}
.submit-footer{padding:1.5rem 4rem;border-top:2.5px solid var(--paper3);display:flex;gap:1rem;justify-content:flex-end;flex-shrink:0;}

/* HOST VOTE */
#sHostVote{flex-direction:column;}
.vote-header{
  display:flex;align-items:center;gap:2.5rem;
  padding:2rem 3rem;border-bottom:3px solid var(--ink);flex-shrink:0;flex-wrap:wrap;
}
.vote-header-title{font-family:'DM Mono',monospace;font-size:1rem;font-weight:400;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);flex:1;}
.vote-voter-pill{
  font-family:'DM Mono',monospace;font-size:1rem;letter-spacing:.08em;
  border:2.5px solid var(--ink);border-radius:var(--r);padding:8px 20px;
}
.vote-ring-wrap{position:relative;width:72px;height:72px;flex-shrink:0;}
.vote-ring-wrap svg{transform:rotate(-90deg);}
.vote-ring-num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'DM Mono',monospace;font-size:1rem;font-weight:400;}
.vote-btns{display:flex;gap:1rem;}

.vote-bars-area{flex:1;display:flex;flex-direction:column;justify-content:stretch;padding:0;overflow-y:auto;}
.vote-bar-row{
  flex:1;display:flex;align-items:center;
  border-bottom:2.5px solid var(--paper3);
  padding:1rem 3rem;gap:2rem;
  transition:background .3s;
}
.vote-bar-row:last-child{border-bottom:none;}
.vote-bar-row.leading{background:var(--paper2);}
.vote-bar-movie{
  font-family:'DM Mono',monospace;font-size:1.8rem;font-weight:400;
  flex:0 0 35%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  letter-spacing:-.01em;
}
.vote-bar-track-wrap{flex:1;display:flex;flex-direction:column;gap:.6rem;}
.vote-bar-track{height:28px;background:var(--paper3);border-radius:3px;overflow:hidden;position:relative;}
.vote-bar-fill{height:100%;border-radius:3px;transition:width 1s cubic-bezier(.34,1.2,.64,1);min-width:6px;width:3%;}
.vote-bar-dot{
  width:18px;height:18px;border-radius:50%;border:3px solid var(--ink);flex-shrink:0;
}

/* REVEAL */
#sReveal{align-items:center;justify-content:center;}
.reveal-wrap{width:min(900px,90vw);}
.reveal-eyebrow{font-family:'DM Mono',monospace;font-size:1rem;letter-spacing:.2em;text-transform:uppercase;color:var(--mute);margin-bottom:1rem;}
.reveal-winner-text{font-family:'DM Mono',monospace;font-size:4rem;font-weight:300;line-height:1.1;letter-spacing:-.03em;margin-bottom:2rem;}
.reveal-rule{height:3px;background:var(--ink);margin-bottom:2rem;}
.reveal-list{display:flex;flex-direction:column;gap:12px;margin-bottom:2rem;}
.reveal-row{display:flex;align-items:center;gap:2rem;padding:1rem 2rem;border-radius:var(--r);}
.reveal-row.r1{background:var(--ink);color:var(--paper);}
.reveal-row.r2{background:var(--paper2);border:2.5px solid var(--ink);}
.reveal-row.r3{background:var(--paper2);border:2.5px solid var(--line);}
.reveal-rank{font-family:'DM Mono',monospace;font-size:1rem;width:32px;color:var(--mute);}
.reveal-row.r1 .reveal-rank{color:var(--ghost);}
.reveal-rname{flex:1;font-size:1.3rem;font-weight:500;}
.reveal-dot{width:16px;height:16px;border-radius:50%;flex-shrink:0;}
.reveal-row.r1 .reveal-dot{border:2.5px solid var(--paper);}
.reveal-row.r2 .reveal-dot,.reveal-row.r3 .reveal-dot{border:2.5px solid var(--ink);}

/* MOBILE */
#sMobile{overflow-y:auto;}
.m-scroll{padding:2rem 1.25rem;min-height:100%;display:flex;flex-direction:column;align-items:center;}
.m-card{background:var(--paper);border:2.5px solid var(--ink);border-radius:var(--r);padding:2rem;width:100%;max-width:520px;}
.m-brand{display:flex;align-items:center;gap:10px;margin-bottom:2rem;}
.m-brand-bar{width:4px;height:22px;}
.m-brand-title{font-family:'DM Mono',monospace;font-size:1rem;font-weight:500;letter-spacing:.04em;}
.m-label{display:block;font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin-bottom:8px;}
.m-input{width:100%;background:var(--paper2);border:2px solid var(--line);border-radius:var(--r);padding:16px;color:var(--ink);font-family:'DM Sans',sans-serif;font-size:18px;outline:none;transition:border .2s;margin-bottom:1rem;}
.m-input:focus{border-color:var(--ink);}
.m-input::placeholder{color:var(--ghost);}
.m-btn{width:100%;padding:18px;background:var(--ink);color:var(--paper);font-family:'DM Sans',sans-serif;font-size:18px;font-weight:500;border:none;border-radius:var(--r);cursor:pointer;transition:opacity .15s,transform .1s;}
.m-state{text-align:center;padding:2rem 0;}
.m-state h3{font-family:'DM Mono',monospace;font-size:1.25rem;font-weight:400;margin-bottom:.75rem;}
.m-state p{font-size:16px;color:var(--mute);line-height:1.7;}
.m-chip{background:var(--ink);color:var(--paper);border-radius:var(--r);padding:7px 14px;font-family:'DM Mono',monospace;font-size:14px;display:inline-block;}
.m-phase-badge{display:flex;align-items:center;gap:10px;margin-bottom:1.5rem;}
.m-phase-dot{width:13px;height:13px;border-radius:50%;flex-shrink:0;}
.m-phase-label{font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);}
.m-add-row{display:grid;grid-template-columns:1fr auto;gap:10px;margin-bottom:1rem;}
.m-add-input{width:100%;background:var(--paper2);border:2px solid var(--line);border-radius:var(--r);padding:16px;color:var(--ink);font-family:'DM Sans',sans-serif;font-size:18px;outline:none;}
.m-add-input:focus{border-color:var(--ink);}
.m-add-btn{padding:16px 20px;background:var(--ink);color:var(--paper);font-family:'DM Mono',monospace;font-size:26px;border:none;border-radius:var(--r);cursor:pointer;line-height:1;}
.m-movie-list{display:flex;flex-direction:column;gap:10px;margin-bottom:1.5rem;max-height:45vh;overflow-y:auto;}
.m-movie-item{display:flex;align-items:center;gap:14px;padding:14px 18px;background:var(--ink);border-radius:var(--r);}
.m-movie-item span{font-family:'DM Mono',monospace;font-size:16px;color:var(--paper);flex:1;}
.m-movie-rm{background:transparent;border:none;color:var(--ghost);font-family:'DM Mono',monospace;font-size:22px;cursor:pointer;padding:0 4px;}
.m-movie-rm:hover{color:var(--paper);}
.m-movie-empty{font-size:15px;color:var(--ghost);font-style:italic;padding:8px 0;}

.mv-list{display:flex;flex-direction:column;gap:16px;margin-bottom:1rem;}
.mv-card{border:2.5px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--paper2);}
.mv-card-header{display:flex;align-items:center;gap:14px;padding:18px 22px;}
.mv-card-dot{width:13px;height:13px;border-radius:50%;flex-shrink:0;}
.mv-card-title{font-size:18px;font-weight:500;flex:1;line-height:1.3;}
.mv-btns{display:grid;grid-template-columns:1fr 1fr;border-top:2px solid var(--line);}
.mv-btn{padding:16px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;border:none;background:var(--paper);font-family:'DM Mono',monospace;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);transition:all .15s;}
.mv-btn:first-child{border-right:1px solid var(--line);}
.mv-btn:hover{background:var(--paper2);}
.mv-btn.up-on{background:#e6f9ed;color:#1a7a3a;}
.mv-btn.dn-on{background:#fce8e5;color:#9a2a1a;}
.mv-btn-icon{font-size:30px;line-height:1;}
.mv-status{font-family:'DM Mono',monospace;font-size:12px;letter-spacing:.08em;color:var(--mute);text-align:center;padding:.75rem 0;}
</style>
</head>
<body>

<div class="map-bg"><svg viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice"><polyline points="80,200 280,200 420,340 680,340 820,480 1100,480" fill="none" stroke="#d63e2a" stroke-width="4"/><polyline points="160,80 160,320 320,480 600,480 800,280 1050,280" fill="none" stroke="#2a6dd6" stroke-width="4"/><polyline points="0,560 300,560 480,380 700,380 900,560 1200,560" fill="none" stroke="#2ab85a" stroke-width="4"/><polyline points="200,700 400,500 600,500 780,700" fill="none" stroke="#d6a42a" stroke-width="4"/><circle cx="280" cy="200" r="7" fill="white" stroke="#d63e2a" stroke-width="3"/><circle cx="420" cy="340" r="9" fill="white" stroke="#0e0e12" stroke-width="3"/><circle cx="680" cy="340" r="7" fill="white" stroke="#d63e2a" stroke-width="3"/><circle cx="160" cy="320" r="7" fill="white" stroke="#2a6dd6" stroke-width="3"/><circle cx="320" cy="480" r="9" fill="white" stroke="#0e0e12" stroke-width="3"/><circle cx="600" cy="480" r="11" fill="white" stroke="#0e0e12" stroke-width="3"/><circle cx="800" cy="280" r="7" fill="white" stroke="#2a6dd6" stroke-width="3"/><circle cx="480" cy="380" r="7" fill="white" stroke="#2ab85a" stroke-width="3"/><circle cx="700" cy="380" r="7" fill="white" stroke="#2ab85a" stroke-width="3"/><circle cx="400" cy="500" r="9" fill="white" stroke="#0e0e12" stroke-width="3"/><circle cx="600" cy="500" r="7" fill="white" stroke="#d6a42a" stroke-width="3"/><circle cx="820" cy="480" r="7" fill="white" stroke="#d63e2a" stroke-width="3"/></svg></div>

<!-- LOBBY -->
<div class="scr" id="sLobby"><div class="lobby-left"><div class="lobby-brand"><div class="lobby-brand-bar" style="background:var(--red)"></div><div class="lobby-brand-bar" style="background:var(--blue)"></div><span class="lobby-brand-title">movie night</span></div><div class="qr-outer" id="qrBox"></div><div class="lobby-scan-label">Scan to join</div></div><div class="lobby-right"><div class="lobby-player-count" id="pCount">0</div><div class="lobby-player-label">players joined</div><div class="lobby-divider"></div><div class="player-chips" id="playerChips"></div><div class="lobby-actions"><button class="btn" style="flex:1;" onclick="hostStartSubmissions()">Start submissions</button><button class="btn-ghost" onclick="hostReset()">Reset</button></div></div></div>

<!-- SUBMISSIONS -->
<div class="scr" id="sSubmit"><div class="submit-header"><div class="submit-header-left"><div><div class="submit-phase">phase 02</div><div class="submit-headline">Drop your movies in</div></div></div><div class="submit-stat-block"><div class="label" style="margin-bottom:.3rem;">movies added</div><div class="submit-count-big" id="fishMCount">0</div></div></div><div class="fish-stage"><canvas id="fishCanvas"></canvas><div class="fish-timer" id="fishTimer">3:00</div></div><div class="submit-footer"><button class="btn" onclick="hostStartVoting()">Start voting now</button><button class="btn-ghost" onclick="hostReset()">Reset</button></div></div>

<!-- HOST VOTE -->
<div class="scr" id="sHostVote"><div class="vote-header"><span class="vote-header-title">movie night — vote on your phone</span><div class="vote-voter-pill" id="vCount">0 voters</div><div class="vote-ring-wrap"><svg width="72" height="72" viewBox="0 0 72 72"><circle fill="none" stroke="#e0dbd0" stroke-width="5" cx="36" cy="36" r="28"/><circle id="vRingArc" fill="none" stroke="#0e0e12" stroke-width="5" stroke-linecap="round" cx="36" cy="36" r="28" stroke-dasharray="175.93" stroke-dashoffset="0"/></svg><div class="vote-ring-num" id="vRingTime">1:30</div></div><div class="vote-btns"><button class="btn" style="font-size:14px;padding:12px 24px;" onclick="hostEndVoting()">Reveal</button><button class="btn-ghost" style="font-size:14px;padding:12px 24px;" onclick="hostReset()">Reset</button></div></div><div class="vote-bars-area" id="vBarsArea"></div></div>

<!-- REVEAL -->
<div class="scr" id="sReveal"><div style="flex:1;display:flex;align-items:center;justify-content:center;padding:2rem;"><div class="reveal-wrap"><div class="reveal-eyebrow">Tonight's pick</div><div class="reveal-winner-text" id="revWinner">...</div><div class="reveal-rule"></div><div class="reveal-list" id="revList"></div><button class="btn" onclick="hostReset()">New night</button></div></div></div>

<!-- MOBILE -->
<div class="scr" id="sMobile"><div class="m-scroll"><div class="m-card"><div class="m-brand"><div class="m-brand-bar" style="background:var(--red)"></div><div class="m-brand-bar" style="background:var(--blue)"></div><span class="m-brand-title">movie night</span></div><div id="mContent"></div></div></div></div>

<script>
// Helper: canvas roundRect
if(!CanvasRenderingContext2D.prototype.roundRect){
  CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){
    if(w<2*r)r=w/2;if(h<2*r)r=h/2;
    this.moveTo(x+r,y);this.lineTo(x+w-r,y);this.quadraticCurveTo(x+w,y,x+w,y+r);
    this.lineTo(x+w,y+h-r);this.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
    this.lineTo(x+r,y+h);this.quadraticCurveTo(x,y+h,x,y+h-r);
    this.lineTo(x,y+r);this.quadraticCurveTo(x,y,x+r,y);return this;
  };
}

const ROOM_ID='room_'+getOrMakeRoom();
const DB_URL='https://sidequest-movie-night-default-rtdb.europe-west1.firebasedatabase.app/';
function getOrMakeRoom(){
  const p=new URLSearchParams(location.search);
  if(p.get('room'))return p.get('room');
  const id=Math.random().toString(36).slice(2,8);
  const u=new URL(location.href);u.searchParams.set('room',id);
  history.replaceState({},'',u);return id;
}
const IS_MOBILE=new URLSearchParams(location.search).has('vote');
const P1=180,P2=90,CIRC_V=175.93;
const BASE=`${DB_URL}/${ROOM_ID}`;
async function dbGet(p=''){const r=await fetch(`${BASE}${p}.json`);return r.ok?r.json():null;}
async function dbSet(p,d){await fetch(`${BASE}${p}.json`,{method:'PUT',body:JSON.stringify(d)});}
async function dbPatch(p,d){await fetch(`${BASE}${p}.json`,{method:'PATCH',body:JSON.stringify(d)});}
async function dbDelete(p=''){await fetch(`${BASE}${p}.json`,{method:'DELETE'});}
let G={},ivs=[];
function clearAll(){ivs.forEach(clearInterval);ivs=[];}
function tick(fn,ms){const id=setInterval(fn,ms);ivs.push(id);return id;}
function esc(s){const d=document.createElement('div');d.textContent=s||'';return d.innerHTML;}

const CHIP_COLORS=['var(--red)','var(--blue)','var(--grn)','var(--ylw)','var(--ink)'];
const BAR_COLORS=['#d63e2a','#2a6dd6','#2ab85a'];

let activeScr=null;
function show(id){
  if(activeScr&&activeScr!==id){
    const old=document.getElementById(activeScr);
    old.classList.add('out');
    setTimeout(()=>{old.classList.remove('on','out');},580);
  }
  setTimeout(()=>{
    const el=document.getElementById(id);
    el.classList.add('on');
    activeScr=id;
  },activeScr?280:0);
}

/* FISHBOWL PHYSICS */
let balls=[],raf=null,cvs=null,ctx=null,CW=0,CH=0;
const GRAV=0.38,DAMP=0.58,FRIC=0.982;
const FONT_POOL=[26,30,34,38,42];
const PILL_COLORS=['#0e0e12','#d63e2a','#2a6dd6','#2ab85a'];

function initFish(){
  cvs=document.getElementById('fishCanvas');
  if(!cvs)return;
  const resizeObserver=()=>{
    if(!cvs.parentElement)return;
    CW=cvs.parentElement.clientWidth;
    CH=cvs.parentElement.clientHeight;
    cvs.width=CW;cvs.height=CH;
    if(ctx)ctx.clearRect(0,0,CW,CH);
  };
  resizeObserver();
  window.addEventListener('resize',resizeObserver);
  ctx=cvs.getContext('2d');
  balls=[];
  if(raf)cancelAnimationFrame(raf);
  fishLoop();
}

function dropBall(text){
  if(!cvs||!ctx||CW===0||CH===0)return;
  const fs=FONT_POOL[Math.floor(Math.random()*FONT_POOL.length)];
  ctx.font=`500 ${fs}px 'DM Mono',monospace`;
  const tw=ctx.measureText(text).width;
  const pw=tw+32,ph=fs+22;
  const col=PILL_COLORS[Math.floor(Math.random()*PILL_COLORS.length)];
  balls.push({
    x:CW/2+(Math.random()-.5)*CW*0.3,y:-ph-10,
    vx:(Math.random()-.5)*4,vy:0,
    text,fs,pw,ph,col,
    rot:(Math.random()-.5)*.25,rotV:(Math.random()-.5)*.05,
    r:Math.hypot(pw,ph)/2
  });
}

function fishLoop(){
  if(!ctx||CW===0||CH===0)return;
  ctx.clearRect(0,0,CW,CH);
  const cx=CW/2,cy=CH/2,rx=Math.max(20,CW/2-12),ry=Math.max(20,CH/2-12);

  ctx.save();
  ctx.strokeStyle='#0e0e12';ctx.lineWidth=3;
  ctx.beginPath();ctx.ellipse(cx,cy,rx,ry,0,0,Math.PI*2);ctx.stroke();
  ctx.beginPath();ctx.ellipse(cx,cy,rx-3,ry-3,0,0,Math.PI*2);ctx.clip();

  for(let i=0;i<balls.length;i++){
    const b=balls[i];
    b.vy+=GRAV;b.vx*=FRIC;b.vy*=FRIC;
    b.rotV*=0.97;b.x+=b.vx;b.y+=b.vy;b.rot+=b.rotV;

    const dx=(b.x-cx)/(rx-b.r*.55),dy=(b.y-cy)/(ry-b.r*.55);
    const d=Math.sqrt(dx*dx+dy*dy);
    if(d>1){
      const nx=dx/d,ny=dy/d;
      b.x=cx+nx*(rx-b.r*.55);b.y=cy+ny*(ry-b.r*.55);
      const dot=b.vx*nx+b.vy*ny;
      b.vx=(b.vx-2*dot*nx)*DAMP;b.vy=(b.vy-2*dot*ny)*DAMP;
      b.rotV+=(Math.random()-.5)*.12;
    }
    for(let j=i+1;j<balls.length;j++){
      const o=balls[j];
      const ddx=o.x-b.x,ddy=o.y-b.y,dd=Math.hypot(ddx,ddy);
      const md=(b.r+o.r)*.68;
      if(dd<md&&dd>.01){
        const nx=ddx/dd,ny=ddy/dd,ov=md-dd;
        b.x-=nx*ov*.5;b.y-=ny*ov*.5;o.x+=nx*ov*.5;o.y+=ny*ov*.5;
        const dv=(b.vx-o.vx)*nx+(b.vy-o.vy)*ny;
        const imp=dv*.6;
        b.vx-=imp*nx;b.vy-=imp*ny;o.vx+=imp*nx;o.vy+=imp*ny;
        b.rotV+=imp*.1;o.rotV-=imp*.1;
      }
    }
    ctx.save();
    ctx.translate(b.x,b.y);ctx.rotate(b.rot);
    const hw=b.pw/2,hh=b.ph/2;
    ctx.beginPath();ctx.roundRect(-hw,-hh,b.pw,b.ph,hh).fill();
    ctx.fillStyle=b.col;ctx.fill();
    ctx.fillStyle='#f5f2eb';
    ctx.font=`500 ${b.fs}px 'DM Mono',monospace`;
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(b.text,0,1);
    ctx.restore();
  }
  ctx.restore();
  raf=requestAnimationFrame(fishLoop);
}

/* HOST LOGIC */
async function hostLobby(){
  show('sLobby');
  const vUrl=new URL(location.href);
  vUrl.searchParams.set('vote','1');
  vUrl.searchParams.set('room',ROOM_ID.replace('room_',''));
  const qrBox=document.getElementById('qrBox');
  qrBox.innerHTML='';
  const sz=Math.min(Math.round(Math.min(window.innerWidth*.36,window.innerHeight*.55)),460);
  try{new QRCode(qrBox,{text:vUrl.toString(),width:sz,height:sz,colorDark:'#000',colorLight:'#fff',correctLevel:QRCode.CorrectLevel.M});}
  catch(e){qrBox.textContent='QR error';}

  let state=await dbGet('/state');
  if(!state||state.phase==='reveal'){
    state={phase:'waiting',waitStart:Date.now(),p1Start:null,submissions:{},movies:[],votes:{},voters:{}};
    await dbSet('/state',state);
  }
  G=state;updateLobbyUI();
  tick(async()=>{
    G=await dbGet('/state')||G;updateLobbyUI();
    if(G.phase==='submitting'){clearAll();hostSubmitScreen();}
    if(G.phase==='voting'){clearAll();if(raf)cancelAnimationFrame(raf);hostVote();}
    if(G.phase==='reveal'){clearAll();showReveal();}
  },2000);
}

function updateLobbyUI(){
  const subs=G.submissions?Object.values(G.submissions):[];
  document.getElementById('pCount').textContent=subs.length;
  const chips=document.getElementById('playerChips');
  if(!subs.length){chips.innerHTML='<span style="font-size:16px;color:var(--ghost);font-style:italic;">waiting for players...</span>';return;}
  chips.innerHTML=subs.map((s,i)=>{
    const col=CHIP_COLORS[i%CHIP_COLORS.length];
    return `<div class="player-chip"><div class="player-chip-dot" style="background:${col}"></div>${esc(s.name)}</div>`;
  }).join('');
}

async function hostStartSubmissions(){
  clearAll();G=await dbGet('/state')||G;
  if(G.phase!=='waiting')return;
  const ns={...G,phase:'submitting',p1Start:Date.now()};
  await dbSet('/state',ns);G=ns;
  hostSubmitScreen();
}

let seenMovies=new Set();
function hostSubmitScreen(){
  show('sSubmit');
  seenMovies.clear();
  setTimeout(()=>{
    initFish();
    if(G.submissions)Object.values(G.submissions).forEach(s=>(s.movies||[]).forEach(m=>{
      if(!seenMovies.has(m)){seenMovies.add(m);setTimeout(()=>dropBall(m),100+Math.random()*400);}
    }));
  },380);
  tick(async()=>{
    G=await dbGet('/state')||G;
    if(G.phase==='voting'){clearAll();if(raf)cancelAnimationFrame(raf);hostVote();return;}
    const subs=G.submissions?Object.values(G.submissions):[];
    const allM=[];subs.forEach(s=>(s.movies||[]).forEach(m=>allM.push(m)));
    document.getElementById('fishMCount').textContent=allM.length;
    allM.forEach(m=>{if(!seenMovies.has(m)){seenMovies.add(m);dropBall(m);}});
    if(G.p1Start){
      const el=Math.min((Date.now()-G.p1Start)/1000,P1);
      const rem=Math.max(0,P1-el);
      const mm=Math.floor(rem/60),ss=Math.floor(rem%60);
      document.getElementById('fishTimer').textContent=`${mm}:${String(ss).padStart(2,'0')}`;
      if(el>=P1){clearAll();await hostStartVoting();}
    }
  },2000);
}

async function hostStartVoting(){
  clearAll();if(raf)cancelAnimationFrame(raf);
  G=await dbGet('/state')||G;
  if(G.phase!=='submitting')return;
  let all=[];
  const subs=G.submissions?Object.values(G.submissions):[];
  subs.forEach(s=>(s.movies||[]).forEach(m=>all.push(m)));
  const defaults=['The Dark Knight','Inception','Parasite','Pulp Fiction','Interstellar','Get Out','The Matrix','Goodfellas','Whiplash','La La Land'];
  while(all.length<3)all.push(defaults[Math.floor(Math.random()*defaults.length)]);
  const picked=all.sort(()=>Math.random()-.5).slice(0,3);
  const votes={};picked.forEach(m=>{votes[m]=0;});
  const ns={...G,phase:'voting',p2Start:Date.now(),movies:picked,votes,voters:{}};
  await dbSet('/state',ns);G=ns;hostVote();
}

function hostVote(){
  show('sHostVote');
  renderVoteBars();
  tick(async()=>{
    G=await dbGet('/state')||G;
    if(G.phase!=='voting'){clearAll();return;}
    renderVoteBars();updateVoteRing();
    if((Date.now()-G.p2Start)/1000>=P2){clearAll();await hostEndVoting();}
  },1000);
}
function renderVoteBars(){
  const mv=G.movies||[],vt=G.votes||{};
  const vc=G.voters?Object.keys(G.voters).filter(k=>G.voters[k]).length:0;
  document.getElementById('vCount').textContent=`${vc} voter${vc===1?'':'s'}`;
  const scores=mv.map(m=>vt[m]||0);
  const minS=Math.min(...scores),maxS=Math.max(...scores);
  const range=maxS-minS||1;
  const winner=scores.indexOf(Math.max(...scores));
  document.getElementById('vBarsArea').innerHTML=mv.map((m,i)=>{
    const pct=Math.round(((scores[i]-minS)/range)*80+10);
    const isLead=i===winner&&vc>0;
    return `<div class="vote-bar-row${isLead?' leading':''}"><div class="vote-bar-movie">${esc(m)}</div><div class="vote-bar-track-wrap"><div class="vote-bar-track"><div class="vote-bar-fill" style="width:${pct}%;background:${BAR_COLORS[i]};"></div></div></div><div class="vote-bar-dot" style="background:${isLead?BAR_COLORS[i]:'var(--paper2)'};border-color:${isLead?BAR_COLORS[i]:'var(--ink)'};"></div></div>`;
  }).join('');
}
function updateVoteRing(){
  const el=(Date.now()-G.p2Start)/1000;
  const rem=Math.max(0,P2-el);
  const mm=Math.floor(rem/60),ss=Math.floor(rem%60);
  document.getElementById('vRingTime').textContent=`${mm}:${String(ss).padStart(2,'0')}`;
  document.getElementById('vRingArc').style.strokeDashoffset=CIRC_V*(1-rem/P2);
}
async function hostEndVoting(){
  G=await dbGet('/state')||G;
  await dbPatch('/state',{phase:'reveal'});G.phase='reveal';
  showReveal();
}
function showReveal(){
  show('sReveal');
  const mv=G.movies||[],vt=G.votes||{};
  const sorted=[...mv].sort((a,b)=>(vt[b]||0)-(vt[a]||0));
  document.getElementById('revWinner').textContent=sorted[0]||'...';
  const rc=['r1','r2','r3'];const rl=['01','02','03'];
  document.getElementById('revList').innerHTML=sorted.map((m,i)=>{
    const col=BAR_COLORS[mv.indexOf(m)]||'var(--ink)';
    return `<div class="reveal-row ${rc[i]||'r3'}"><span class="reveal-rank mono">${rl[i]}</span><div class="reveal-dot" style="background:${rc[i]==='r1'?'transparent':col};border-color:${rc[i]==='r1'?'var(--paper)':col};"></div><span class="reveal-rname">${esc(m)}</span></div>`;
  }).join('');
}
async function hostReset(){
  clearAll();if(raf)cancelAnimationFrame(raf);
  await dbDelete();location.href=location.pathname;
}

/* MOBILE */
let myName='',myMovies=[],myVotes={},joined=false,mPoll=null,lastSent={};
async function mobileInit(){
  show('sMobile');
  G=await dbGet('/state')||{};
  const ph=G.phase||'waiting';
  if(ph==='waiting'){joined?mWait():mJoinScreen();}
  else if(ph==='submitting'){mSubmitScreen();}
  else if(ph==='voting'){mVoteScreen();}
  else if(ph==='reveal'){mRevealScreen();}
}
function mJoinScreen(){
  document.getElementById('mContent').innerHTML=`<div class="m-phase-badge"><div class="m-phase-dot" style="background:var(--red)"></div><span class="m-phase-label">join lobby</span></div><label class="m-label">Your name</label><input class="m-input" id="mName" placeholder="Enter your name..." maxlength="30"/><button class="m-btn" onclick="mJoin()">Join</button>`;
  if(myName)document.getElementById('mName').value=myName;
  document.getElementById('mName').addEventListener('keydown',e=>{if(e.key==='Enter')mJoin();});
  pollUntil(['submitting','voting','reveal']);
}
async function mJoin(){
  const name=(document.getElementById('mName').value||'').trim();
  if(!name){alert('Enter your name!');return;}
  myName=name;
  const key=name.replace(/[.#$/[\]]/g,'_');
  await dbSet(`/state/submissions/${key}`,{name,movies:[]});
  joined=true;mWait();
}
function mWait(){
  document.getElementById('mContent').innerHTML=`<div class="m-state"><h3>You're in</h3><p>Waiting for the host to open submissions...</p><div style="margin-top:1.5rem;"><div class="m-label" style="margin-bottom:.5rem;">Logged in as</div><div class="m-chip">${esc(myName)}</div></div></div>`;
  pollUntil(['submitting','voting','reveal']);
}
function mSubmitScreen(){
  if(mPoll)clearInterval(mPoll);
  document.getElementById('mContent').innerHTML=`<div class="m-phase-badge"><div class="m-phase-dot" style="background:var(--blue)"></div><span class="m-phase-label">add your picks</span></div><p style="font-family:'DM Mono',monospace;font-size:12px;color:var(--mute);margin-bottom:1rem;">as ${esc(myName)}</p><div class="m-movie-list" id="mMovieList"></div><div class="m-add-row"><input class="m-add-input" id="mMovieInput" placeholder="Type a movie..." maxlength="80"/><button class="m-add-btn" onclick="mAddMovie()">+</button></div><p style="font-size:11px;color:var(--ghost);text-align:center;">add as many as you like</p>`;
  document.getElementById('mMovieInput').addEventListener('keydown',e=>{if(e.key==='Enter')mAddMovie();});
  renderMMovieList();
  pollUntil(['voting','reveal']);
}
function renderMMovieList(){
  const el=document.getElementById('mMovieList');if(!el)return;
  if(!myMovies.length){el.innerHTML='<p class="m-movie-empty">No picks yet</p>';return;}
  el.innerHTML=myMovies.map((m,i)=>`<div class="m-movie-item"><span>${esc(m)}</span><button class="m-movie-rm" onclick="mRemove(${i})">✕</button></div>`).join('');
}
async function mAddMovie(){
  const inp=document.getElementById('mMovieInput');if(!inp)return;
  const val=(inp.value||'').trim();if(!val)return;
  myMovies.push(val);inp.value='';inp.focus();
  renderMMovieList();
  const key=myName.replace(/[.#$/[\]]/g,'_');
  await dbSet(`/state/submissions/${key}`,{name:myName,movies:[...myMovies]});
}
async function mRemove(idx){
  myMovies.splice(idx,1);renderMMovieList();
  const key=myName.replace(/[.#$/[\]]/g,'_');
  await dbSet(`/state/submissions/${key}`,{name:myName,movies:[...myMovies]});
}
function mVoteScreen(){
  if(mPoll)clearInterval(mPoll);
  const mv=G.movies||[];myVotes={};lastSent={};
  document.getElementById('mContent').innerHTML=`<div class="m-phase-badge"><div class="m-phase-dot" style="background:var(--grn)"></div><span class="m-phase-label">vote</span></div><p style="font-size:12px;color:var(--mute);margin-bottom:1rem;">as ${esc(myName)}</p><div class="mv-list">${mv.map((m,i)=>`<div class="mv-card"><div class="mv-card-header"><div class="mv-card-dot" style="background:${BAR_COLORS[i]}"></div><div class="mv-card-title">${esc(m)}</div></div><div class="mv-btns"><button class="mv-btn" id="up${i}" onclick="mToggle(${i},1)"><span class="mv-btn-icon">👍</span><span>For it</span></button><button class="mv-btn" id="dn${i}" onclick="mToggle(${i},-1)"><span class="mv-btn-icon">👎</span><span>Against</span></button></div></div>`).join('')}</div><div class="mv-status" id="mvStatus">Tap to cast your votes</div>`;
  pollUntil(['reveal']);
}
async function mToggle(idx,dir){
  const m=G.movies[idx];
  myVotes[m]===dir?delete myVotes[m]:(myVotes[m]=dir);
  mUpdateVoteUI();
  await mPushVote(G.movies);
}
function mUpdateVoteUI(){
  const mv=G.movies||[];
  mv.forEach((m,i)=>{document.getElementById('up'+i)?.classList.toggle('up-on',myVotes[m]===1);document.getElementById('dn'+i)?.classList.toggle('dn-on',myVotes[m]===-1);});
  const total=Object.keys(myVotes).length;
  const st=document.getElementById('mvStatus');if(!st)return;
  if(!total){st.textContent='Tap to cast your votes';return;}
  const ups=Object.values(myVotes).filter(v=>v===1).length;
  const dns=Object.values(myVotes).filter(v=>v===-1).length;
  const parts=[];if(ups)parts.push(`${ups} for`);if(dns)parts.push(`${dns} against`);
  st.textContent=parts.join(', ')+' — votes live';
}
async function mPushVote(mv){
  const key=myName.replace(/[.#$/[\]]/g,'_');
  const cur=await dbGet('/state/votes')||{};
  const patch={};
  for(const[m,v]of Object.entries(lastSent))patch[m]=(cur[m]||0)-v;
  for(const[m,v]of Object.entries(myVotes)){const b=patch[m]!==undefined?patch[m]:(cur[m]||0);patch[m]=b+v;}
  lastSent={...myVotes};
  await dbPatch('/state/voters',{[key]:Object.keys(myVotes).length>0});
  if(Object.keys(patch).length)await dbPatch('/state/votes',patch);
}
function mRevealScreen(){
  if(mPoll)clearInterval(mPoll);
  const mv=G.movies||[],vt=G.votes||{};
  const sorted=[...mv].sort((a,b)=>(vt[b]||0)-(vt[a]||0));
  document.getElementById('mContent').innerHTML=`<div class="m-state"><div class="m-label" style="margin-bottom:.75rem;">Tonight's pick</div><h3 style="font-size:1.5rem;font-family:'DM Mono',monospace;font-weight:300;">${esc(sorted[0]||'...')}</h3></div>`;
}
function pollUntil(phases){
  if(mPoll)clearInterval(mPoll);
  mPoll=setInterval(async()=>{
    const st=await dbGet('/state');if(!st)return;G=st;
    if(phases.includes(st.phase)){clearInterval(mPoll);mobileInit();}
  },2500);
}

(async function boot(){
  if(IS_MOBILE){await mobileInit();}
  else{const st=await dbGet('/state');G=st||{};if(G.phase==='voting')hostVote();else if(G.phase==='submitting')hostSubmitScreen();else if(G.phase==='reveal')showReveal();else hostLobby();}
})();
</script>
