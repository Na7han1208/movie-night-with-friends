<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Film Festival Extravaganza — Live</title>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <link rel="stylesheet" href="./CSS/main.css" />
    <link rel="stylesheet" href="./CSS/night.css" />
  </head>
  <body>
    <a class="home-link" href="./index.html">← Home</a>

    <!-- LOBBY -->
    <div class="scr" id="sLobby">
      <div class="lobby-left">
        <div class="lobby-brand">
          <span class="nl-dot"></span>Digital Arts Movie Night
        </div>
        <div class="qr-outer" id="qrBox"></div>
        <div class="lobby-scan-label">Scan to join on your phone</div>
        <div class="lobby-room-code" id="roomCodeLabel">Room code: ...</div>
      </div>
      <div class="lobby-right">
        <div class="lobby-player-count" id="pCount">0</div>
        <div class="lobby-player-label">players joined</div>
        <div class="lobby-divider"></div>
        <div class="player-chips" id="playerChips">
          <span
            id="lobbyEmpty"
            style="font-size: 0.88rem; color: var(--w3); font-style: italic"
            >waiting for players...</span
          >
        </div>
        <p class="caps" style="margin-top: 1.4rem; margin-bottom: 0.6rem">
          Selection mode
        </p>
        <div class="mode-row" id="modeRow"></div>

        <div id="themeGridWrap" style="display: none">
          <p class="caps" style="margin-bottom: 0.6rem">
            Pick a theme to begin
          </p>
          <div class="theme-grid" id="themeGrid"></div>
        </div>

        <div class="lobby-actions">
          <button
            class="btn-p"
            id="startSubmitBtn"
            style="flex: 1"
            onclick="hostStartSubmissions()"
          >
            Start Submissions
          </button>
          <button class="btn-s" onclick="hostReset()">Reset</button>
        </div>
      </div>
    </div>

    <!-- SUBMISSIONS (fishbowl OR wheel) -->
    <div class="scr" id="sSubmit">
      <div class="submit-header">
        <div class="submit-headline">Drop your movies in</div>
        <div class="submit-stat-block">
          <p class="caps" style="margin-bottom: 0.2rem">movies added</p>
          <div class="submit-count-big" id="fishMCount">0</div>
        </div>
      </div>

      <div class="fish-stage" id="fishStageWrap">
        <canvas id="fishCanvas"></canvas>
        <div class="fish-timer" id="fishTimer">3:00</div>
      </div>

      <div class="wheel-stage" id="wheelStageWrap" style="display: none">
        <div
          style="
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.4rem;
          "
        >
          <p class="caps" id="wheelSpinLabel">Spin 1 of 3</p>
          <div class="wheel-wrap">
            <div class="wheel-pointer"></div>
            <canvas id="wheelCanvas"></canvas>
            <div class="wheel-result" id="wheelResultLabel"></div>
          </div>
        </div>
      </div>

      <div class="submit-footer">
        <button class="btn-p" onclick="hostStartVoting()">
          Start Voting Now
        </button>
        <button class="btn-s" onclick="hostReset()">Reset</button>
      </div>
    </div>

    <!-- HOST VOTE -->
    <div class="scr" id="sHostVote">
      <div class="vote-header">
        <span class="vote-header-title">Vote on your phone</span>
        <div class="vote-voter-pill" id="vCount">0 voters</div>
        <div class="vote-ring-wrap">
          <svg width="56" height="56" viewBox="0 0 72 72">
            <circle
              fill="none"
              stroke="var(--s3)"
              stroke-width="5"
              cx="36"
              cy="36"
              r="28"
            />
            <circle
              id="vRingArc"
              fill="none"
              stroke="var(--red)"
              stroke-width="5"
              stroke-linecap="round"
              cx="36"
              cy="36"
              r="28"
              stroke-dasharray="175.93"
              stroke-dashoffset="0"
            />
          </svg>
          <div class="vote-ring-num" id="vRingTime">1:30</div>
        </div>
        <div class="vote-btns">
          <button class="btn-p btn-sm" onclick="hostEndVoting()">Reveal</button>
          <button class="btn-s btn-sm" onclick="hostReset()">Reset</button>
        </div>
      </div>
      <div class="vote-bars-area" id="vBarsArea"></div>
    </div>

    <!-- REVEAL -->
    <div class="scr" id="sReveal">
      <div
        style="
          flex: 1;
          display: flex;
          align-items: center;
          justify-content: center;
          padding: 2rem 1rem;
          width: 100%;
        "
      >
        <div class="reveal-wrap" id="revealWrap"></div>
      </div>
    </div>

    <!-- RATING -->
    <div class="scr" id="sRating">
      <div
        style="
          flex: 1;
          display: flex;
          align-items: center;
          justify-content: center;
          padding: 2rem 1rem;
          width: 100%;
        "
      >
        <div class="rating-wrap" id="ratingWrap"></div>
      </div>
    </div>

    <!-- MOBILE VOTER VIEW -->
    <div class="scr" id="sMobile">
      <div class="m-scroll">
        <div class="m-card">
          <div class="m-brand">
            <span class="nl-dot"></span>Digital Arts Movie Night
          </div>
          <div id="mContent"></div>
        </div>
      </div>
    </div>

    <script src="./JS/config.js"></script>
    <script src="./JS/db.js"></script>
    <script src="./JS/themes-data.js"></script>
    <script src="./JS/movies-data.js"></script>
    <script src="./JS/night.js"></script>
  </body>
</html>
